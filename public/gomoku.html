<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>五子棋 · 一起玩</title>
<meta name="theme-color" content="#EE3A2B">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fonts/mashanzheng.css">
<style>
  :root{
    --paper:#FAF4E6; --ink:#1A1A18; --red:#EE3A2B;
    --c2:#2D6CDF; --c3:#13A87A; --c4:#F4B400; --c5:#8A5CD7;
    --gray:#6A6A60; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--paper);color:var(--ink);font-family:'Noto Sans SC',sans-serif;
    min-height:100vh;padding:14px 14px 60px;position:relative;}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(rgba(26,26,24,.04) 1px,transparent 1px);background-size:3px 3px;}
  .back{position:fixed;top:12px;left:12px;z-index:10;color:var(--ink);text-decoration:none;
    font-size:12px;font-weight:900;letter-spacing:.2em;padding:7px 13px;
    border:2px solid var(--ink);background:var(--paper);}
  .back:hover{background:var(--ink);color:var(--paper);}

  .head{text-align:center;margin:44px 0 4px;position:relative;}
  .head .badge{display:inline-block;background:var(--c3);color:#fff;font-weight:900;font-size:10px;
    letter-spacing:.28em;padding:5px 12px;transform:rotate(-3deg);}
  .head h1{font-family:'Ma Shan Zheng',serif;font-weight:400;font-size:52px;line-height:1.1;
    color:var(--ink);margin:10px 0 2px;}
  .head h1 em{font-style:normal;color:var(--c3);}
  .head .sub{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--gray);}
  .head .star{position:absolute;font-size:20px;}
  .head .s1{top:6px;left:16%;color:var(--red);transform:rotate(-14deg);}
  .head .s2{top:30px;right:15%;color:var(--c4);font-size:16px;}
  .head .s3{bottom:2px;left:24%;color:var(--c5);font-size:14px;}

  .modes{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0 12px;}
  .mbtn{border:2px solid var(--ink);background:#fff;color:var(--ink);font-family:inherit;font-weight:900;
    font-size:12px;letter-spacing:.1em;padding:9px 14px;cursor:pointer;transition:all .15s;}
  .mbtn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink);}
  .mbtn.on{background:var(--c3);border-color:var(--c3);color:#fff;}
  .mbtn.on:hover{box-shadow:3px 3px 0 var(--ink);}

  .board-wrap{max-width:600px;margin:0 auto;}
  .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;flex-wrap:wrap;}
  .turn-chip{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);background:#fff;
    padding:8px 14px;font-weight:900;font-size:13px;}
  .turn-chip .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);flex-shrink:0;}
  .turn-chip.me{background:var(--c3);border-color:var(--c3);color:#fff;}
  .turn-chip.me .dot{border-color:#fff;}
  .score{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--gray);}
  .score b{color:var(--ink);}

  #board{width:100%;display:block;background:#FBF6EA;border:3px solid var(--ink);
    box-shadow:6px 6px 0 rgba(26,26,24,.18);cursor:pointer;}
  .acts{display:flex;justify-content:center;gap:10px;margin-top:14px;}
  .btn{border:2px solid var(--ink);background:#fff;color:var(--ink);font-family:inherit;font-weight:900;
    font-size:13px;letter-spacing:.14em;padding:11px 24px;cursor:pointer;transition:all .15s;}
  .btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink);}
  .btn.primary{background:var(--red);border-color:var(--red);color:#fff;}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none;}
  .hint{text-align:center;margin-top:10px;font-size:12px;color:var(--gray);letter-spacing:.06em;min-height:18px;}

  /* 胜利横幅 */
  .win{position:fixed;inset:0;z-index:50;background:rgba(26,26,24,.78);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--paper);}
  .win .wt{font-family:'Ma Shan Zheng',serif;font-size:clamp(44px,11vw,84px);line-height:1.1;}
  .win .wt em{font-style:normal;color:var(--c4);}
  .win .ws{font-size:13px;letter-spacing:.3em;color:rgba(250,244,230,.75);margin:14px 0 28px;}
  .win .btn{color:var(--paper);border-color:var(--paper);background:transparent;}
  .win .btn:hover{background:var(--paper);color:var(--ink);box-shadow:none;}
  .win .btn.primary{background:var(--red);border-color:var(--red);}

  /* 彩带 */
  .cf{position:fixed;top:-16px;width:9px;height:14px;z-index:60;pointer-events:none;
    animation:cfFall linear forwards;}
  @keyframes cfFall{
    0%{transform:translateY(0) rotate(0);}
    100%{transform:translateY(105vh) rotate(720deg);}
  }
  .hidden{display:none !important;}

  /* 远程对战 */
  #remoteBox{border:2px dashed var(--ink);background:#fff;padding:14px;margin-bottom:12px;}
  #remoteBox .rt{font-weight:900;font-size:12px;letter-spacing:.28em;margin-bottom:10px;color:var(--c3);}
  .rrow{display:flex;gap:8px;margin-bottom:8px;}
  .rfield{flex:1;border:2px solid var(--ink);background:var(--paper);font-family:inherit;font-weight:700;
    font-size:14px;padding:9px 10px;outline:none;min-width:0;}
  .rfield:focus{border-color:var(--c3);}
  .rnum{font-family:var(--mono);font-size:30px;font-weight:900;color:var(--red);letter-spacing:.18em;margin:4px 0;}
  .rfield-wrap{margin-bottom:12px;}
  .rlabel{display:block;font-size:10px;font-weight:900;letter-spacing:.22em;color:var(--gray);margin-bottom:5px;}
  .rblock{border:2px solid var(--ink);padding:11px;margin-bottom:10px;background:var(--paper);}
  .rbt{font-weight:900;font-size:12px;letter-spacing:.12em;margin-bottom:4px;}
  .rbdesc{font-size:11px;color:var(--gray);margin-bottom:9px;line-height:1.5;}
  /* 提示条 */
  #noticeBar{border:2px solid var(--red);background:#FFF3F1;color:var(--red);font-weight:900;font-size:12px;
    padding:10px 12px;margin-bottom:10px;line-height:1.6;}
  /* 房间条：座位 + 身份 */
  #roomStrip{border:2px solid var(--ink);background:#fff;padding:10px;margin-bottom:10px;}
  .seat{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px dashed #ddd;font-size:12px;}
  .seat:last-child{border-bottom:none;}
  .seat.off{opacity:.45;}
  .seat.empty .sname{color:var(--gray);}
  .sdot{width:15px;height:15px;border-radius:50%;border:2px solid var(--ink);flex-shrink:0;background:var(--paper);}
  .sdot.ghost{border-style:dashed;}
  .sname{font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sname em{font-style:normal;background:var(--red);color:#fff;font-size:10px;padding:1px 5px;margin-left:6px;}
  .scolor{font-family:var(--mono);font-size:11px;color:var(--gray);}
  .sconn{font-size:10px;color:var(--c3);min-width:30px;text-align:right;}
  .seat.off .sconn{color:var(--red);}
  .strip-foot{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .role-badge{font-weight:900;font-size:11px;letter-spacing:.1em;padding:5px 10px;border:2px solid var(--ink);background:var(--c4);}
  .role-badge.spectator{background:#fff;color:var(--gray);border-style:dashed;}
  .role-badge.player{background:var(--c3);color:#fff;border-color:var(--c3);}
  .spect{font-size:11px;color:var(--gray);flex:1;}
  .btn.tiny{padding:6px 12px;font-size:11px;letter-spacing:.1em;}
  /* 战绩 */
  #recordsBox{border:2px solid var(--ink);background:#fff;padding:11px;margin-top:12px;}
  #recordsBox .tbl{font-weight:900;font-size:11px;letter-spacing:.22em;color:var(--c3);margin-bottom:8px;}
  #recordsBox .rec{display:flex;align-items:center;gap:8px;font-size:11px;padding:5px 0;border-bottom:1px dotted #e5e5e5;}
  #recordsBox .rec:last-child{border-bottom:none;}
  #recordsBox .rw{font-weight:900;padding:1px 6px;font-size:11px;}
  #recordsBox .rw.win{background:var(--c3);color:#fff;}
  #recordsBox .rw.lose{background:#eee;color:var(--gray);}
  #recordsBox .rmeta{flex:1;color:var(--gray);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #recordsBox .rdate{font-family:var(--mono);font-size:10px;color:var(--gray);}
  #recordsBox .rempty{font-size:11px;color:var(--gray);}
  @media (max-width:640px){
    .head h1{font-size:40px;}
    .back{font-size:11px;padding:6px 10px;}
  }
</style>
</head>
<body>

<a class="back" href="index.html#play">← 回基地</a>

<div class="head">
  <span class="star s1">✦</span><span class="star s2">✶</span><span class="star s3">❉</span>
  <div class="badge">黑 白 手 谈</div>
  <h1>五<em>子</em>棋</h1>
  <div class="sub">GOMOKU · 15 路 · 先成五子者胜</div>
</div>

<div class="modes">
  <button class="mbtn on" id="mPvp"  onclick="setMode('pvp')">双人同屏</button>
  <button class="mbtn"    id="mPveB" onclick="setMode('pveb')">人机 · 我先手</button>
  <button class="mbtn"    id="mPveW" onclick="setMode('pvew')">人机 · AI 先手</button>
  <button class="mbtn"    id="mRemote" onclick="setMode('remote')">远程对战</button>
</div>

<div class="board-wrap">

  <div id="remoteBox" class="hidden">
    <div class="rt">远 程 对 战</div>

    <div class="rfield-wrap">
      <label class="rlabel">你的名字</label>
      <input class="rfield" id="rName" placeholder="固定后会自动记住" maxlength="12">
    </div>

    <div class="rblock">
      <div class="rbt">① 开新局</div>
      <div class="rbdesc">只需要名字，点下面的按钮系统自动给你一个 4 位房号</div>
      <button class="btn primary" id="rCreate" style="width:100%;" onclick="rCreate()">创建房间</button>
    </div>

    <div class="rblock">
      <div class="rbt">② 加入别人的房间</div>
      <div class="rbdesc">需要朋友给你的 4 位房号</div>
      <div class="rrow">
        <input class="rfield" id="rRoom" placeholder="房间号(4位)" maxlength="4" inputmode="numeric">
        <button class="btn" onclick="rJoin()">加入</button>
      </div>
    </div>

    <div class="hint" id="rHint" style="margin-top:10px;">先到的人执黑先行，第三人进入自动成为观看者</div>

    <div id="remoteWait" class="hidden" style="text-align:center;margin-top:12px;">
      <div style="font-size:11px;letter-spacing:.28em;color:var(--gray);">房 间 号</div>
      <div class="rnum" id="rRoomNum">----</div>
      <div style="font-size:12px;color:var(--gray);">把号码发给朋友，对方加入后自动开局</div>
    </div>
  </div>

  <div id="noticeBar" class="hidden"></div>

  <div id="roomStrip" class="hidden">
    <div id="seats"></div>
    <div class="strip-foot">
      <span id="roleBadge" class="role-badge"></span>
      <span id="spectCount" class="spect"></span>
      <button class="btn tiny" onclick="leaveRemote()">离开房间</button>
    </div>
  </div>

  <div class="bar">
    <div class="turn-chip" id="turnChip"><span class="dot" id="turnDot"></span><span id="turnText">黑方落子</span></div>
    <div class="score">局分　黑 <b id="sB">0</b> : <b id="sW">0</b> 白 · 第 <b id="moveNo">0</b> 手</div>
  </div>
  <canvas id="board" width="660" height="660"></canvas>
  <div class="acts">
    <button class="btn" id="btnUndo" onclick="undo()">悔棋</button>
    <button class="btn primary" onclick="restart()">重新开局</button>
  </div>
  <div class="hint" id="hint">点击棋盘交叉点落子</div>

  <div id="recordsBox" class="hidden">
    <div class="tbl">战 绩 记 录</div>
    <div id="recSummary" style="font-size:11px;color:var(--gray);margin-bottom:8px;"></div>
    <div id="recList"></div>
  </div>
</div>

<div class="win hidden" id="winBanner">
  <div class="wt" id="winTitle"></div>
  <div class="ws" id="winSub">五 子 连 珠 · 本 局 获 胜</div>
  <div style="display:flex;gap:12px;">
    <button class="btn primary" onclick="restart()">再来一局</button>
  </div>
</div>

<script src="gomoku-core.js"></script>
<script>
var C = window.GomokuCore;
var PAD = 36, CELL = 42;                 // 660 = 36*2 + 42*14
var cv = document.getElementById('board');
var ctx = cv.getContext('2d');

var board, turn, mode, over, hist, winInfo, thinking;
var score = { b: 0, w: 0 };
var lastMover = null; // 悔棋后轮到谁
var lastRemote = null; // 远程模式最后一手 {x,y,color}

// ============ 绘制 ============
function px(i){ return PAD + i * CELL; }

function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  // 底色
  ctx.fillStyle = '#FBF6EA';
  ctx.fillRect(0,0,cv.width,cv.height);
  // 网格
  ctx.strokeStyle = 'rgba(26,26,24,.7)';
  ctx.lineWidth = 1;
  for (var i=0;i<C.SIZE;i++){
    ctx.beginPath(); ctx.moveTo(px(0),px(i)+0.5); ctx.lineTo(px(C.SIZE-1),px(i)+0.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px(i)+0.5,px(0)); ctx.lineTo(px(i)+0.5,px(C.SIZE-1)); ctx.stroke();
  }
  // 外框加粗
  ctx.lineWidth = 2.5;
  ctx.strokeRect(px(0),px(0),CELL*14,CELL*14);
  // 星位
  ctx.fillStyle = 'rgba(26,26,24,.8)';
  [[3,3],[11,3],[7,7],[3,11],[11,11]].forEach(function(p){
    ctx.beginPath(); ctx.arc(px(p[0]),px(p[1]),4,0,7); ctx.fill();
  });
  // 棋子
  for (var y=0;y<C.SIZE;y++){
    for (var x=0;x<C.SIZE;x++){
      if (board[y][x] !== C.EMPTY) drawStone(x,y,board[y][x],false);
    }
  }
  // 最后一手标记
  if (!over){
    var lm = (mode === 'remote') ? lastRemote : (hist.length ? hist[hist.length-1] : null);
    if (lm){
      ctx.fillStyle = '#EE3A2B';
      ctx.beginPath(); ctx.arc(px(lm.x),px(lm.y),5.5,0,7); ctx.fill();
    }
  }
  // 胜利连线
  if (winInfo){
    ctx.strokeStyle = 'rgba(238,58,43,.85)';
    ctx.lineWidth = 5; ctx.lineCap = 'round';
    var a = winInfo[0], b = winInfo[winInfo.length-1];
    ctx.beginPath(); ctx.moveTo(px(a[0]),px(a[1])); ctx.lineTo(px(b[0]),px(b[1])); ctx.stroke();
    winInfo.forEach(function(p){
      ctx.strokeStyle = '#EE3A2B'; ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.arc(px(p[0]),px(p[1]),21,0,7); ctx.stroke();
    });
  }
}

function drawStone(x,y,color,isLast){
  var cx = px(x), cy = px(y), r = 19;
  // 硬阴影
  ctx.fillStyle = 'rgba(26,26,24,.22)';
  ctx.beginPath(); ctx.arc(cx+3,cy+3.5,r,0,7); ctx.fill();
  if (color === C.BLACK){
    var g = ctx.createRadialGradient(cx-6,cy-7,2,cx,cy,r);
    g.addColorStop(0,'#5a5a54'); g.addColorStop(1,'#141412');
    ctx.fillStyle = g;
  } else {
    var g2 = ctx.createRadialGradient(cx-6,cy-7,2,cx,cy,r);
    g2.addColorStop(0,'#ffffff'); g2.addColorStop(1,'#dcd5c2');
    ctx.fillStyle = g2;
  }
  ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = color === C.BLACK ? '#0a0a09' : 'rgba(26,26,24,.75)';
  ctx.stroke();
}

// ============ 状态与流程 ============
function resetState(){
  board = C.createBoard(); turn = C.BLACK; over = false; hist = []; winInfo = null; thinking = false;
  lastRemote = null;
}

function restart(){
  if (mode === 'remote'){
    if (rws && rws.readyState === 1) rws.send(JSON.stringify({ type:'restart' }));
    document.getElementById('winBanner').classList.add('hidden');
    return;
  }
  resetState();
  document.getElementById('winBanner').classList.add('hidden');
  document.getElementById('btnUndo').disabled = false;
  if (mode === 'pvew'){ // AI 执黑先行
    thinking = true; updateUI();
    setTimeout(function(){ aiTurn(); }, 300);
  } else updateUI();
  draw();
}

function setMode(m){
  mode = m;
  document.getElementById('mPvp').classList.toggle('on', m==='pvp');
  document.getElementById('mPveB').classList.toggle('on', m==='pveb');
  document.getElementById('mPveW').classList.toggle('on', m==='pvew');
  document.getElementById('mRemote').classList.toggle('on', m==='remote');
  document.getElementById('remoteBox').classList.toggle('hidden', m!=='remote');
  document.getElementById('recordsBox').classList.toggle('hidden', m!=='remote');
  document.getElementById('btnUndo').disabled = (m === 'remote');
  document.getElementById('winBanner').classList.add('hidden');
  document.getElementById('noticeBar').classList.add('hidden');
  if (m === 'remote'){
    resetState(); draw();
    document.getElementById('hint').textContent = '创建或加入房间开始远程对弈';
    renderRecords();
    if (rState){ rSync(); } else {
      document.getElementById('roomStrip').classList.add('hidden');
      document.getElementById('remoteWait').classList.add('hidden');
      updateUI();
    }
    return;
  }
  document.getElementById('roomStrip').classList.add('hidden');
  if (rws){ try{ rws.close(); }catch(e){} rws = null; rState = null; rMyColor = null; }
  restart();
}

function place(x,y){
  board[y][x] = turn;
  hist.push({x:x,y:y,color:turn});
  var line = C.winLine(board,x,y);
  if (line){
    over = true; winInfo = line;
    if (turn === C.BLACK) score.b++; else score.w++;
    showWin(turn);
  } else if (C.isFull(board)){
    over = true;
    document.getElementById('hint').textContent = '棋盘满了，平局！';
  } else {
    turn = turn === C.BLACK ? C.WHITE : C.BLACK;
  }
  document.getElementById('btnUndo').disabled = false;
}

function cvClick(ev){
  if (over || thinking) return;
  if (mode === 'remote'){
    if (!rState || rState.phase !== 'playing') return;
    if (!rMyColor || turn !== (rMyColor === 'black' ? C.BLACK : C.WHITE)) return;
    var rr = cv.getBoundingClientRect();
    var sx2 = cv.width / rr.width;
    var x2 = Math.round(((ev.clientX - rr.left) * sx2 - PAD) / CELL);
    var y2 = Math.round(((ev.clientY - rr.top) * sx2 - PAD) / CELL);
    if (x2 < 0 || x2 >= C.SIZE || y2 < 0 || y2 >= C.SIZE) return;
    if (rws && rws.readyState === 1) rws.send(JSON.stringify({ type:'move', x:x2, y:y2 }));
    return;
  }
  if (mode === 'pveb' && turn === C.WHITE) return; // 等 AI
  var r = cv.getBoundingClientRect();
  var sx = cv.width / r.width;
  var x = Math.round(((ev.clientX - r.left) * sx - PAD) / CELL);
  var y = Math.round(((ev.clientY - r.top) * sx - PAD) / CELL);
  if (x < 0 || x >= C.SIZE || y < 0 || y >= C.SIZE) return;
  if (board[y][x] !== C.EMPTY){ document.getElementById('hint').textContent = '这里已经有子了'; return; }
  document.getElementById('hint').textContent = mode==='pvp' ? '点击棋盘交叉点落子' : (turn===C.BLACK?'你落子后 AI 思考中…':'');
  place(Math.round(x),Math.round(y));
  draw(); updateUI();
  if (!over && mode !== 'pvp' && turn !== humanColor()){
    thinking = true; updateUI();
    setTimeout(function(){ aiTurn(); }, 280);
  }
}

function humanColor(){
  if (mode === 'pveb') return C.BLACK;  // 人执黑
  if (mode === 'pvew') return C.WHITE;  // 人执白
  return null;                           // 双人无人机
}

function aiTurn(){
  var ai = turn;
  var opp = ai === C.BLACK ? C.WHITE : C.BLACK;
  var m = C.aiMove(board, ai, opp);
  thinking = false;
  if (m) place(m.x, m.y);
  draw(); updateUI();
}

function undo(){
  if (mode === 'remote') return;
  if (thinking || !hist.length) return;
  document.getElementById('winBanner').classList.add('hidden');
  var steps = 1;
  if (mode !== 'pvp'){
    // 人机：撤到轮到自己（若最后一手是 AI 则撤 2）
    if (hist[hist.length-1].color !== humanColor() && hist.length >= 2) steps = 2;
  }
  while (steps-- && hist.length){
    var mv = hist.pop();
    board[mv.y][mv.x] = C.EMPTY;
  }
  over = false; winInfo = null; thinking = false;
  turn = hist.length ? (hist[hist.length-1].color === C.BLACK ? C.WHITE : C.BLACK) : C.BLACK;
  // 双人模式：undo 后轮到刚被撤掉那手的颜色
  if (mode === 'pvp' && hist.length) turn = hist[hist.length-1].color === C.BLACK ? C.WHITE : C.BLACK;
  document.getElementById('btnUndo').disabled = !hist.length;
  draw(); updateUI();
}

function showWin(color){
  var t = document.getElementById('winTitle');
  var name = color === C.BLACK ? '黑方' : '白方';
  var isAI = (mode === 'pveb' && color === C.WHITE) || (mode === 'pvew' && color === C.BLACK);
  if (isAI){ t.innerHTML = 'AI 五子<em>连珠</em>'; document.getElementById('winSub').textContent = '再 来 必 翻 盘'; }
  else if (mode === 'pvp'){ t.innerHTML = name + ' 五子<em>连珠</em>'; document.getElementById('winSub').textContent = '五 子 连 珠 · 本 局 获 胜'; }
  else { t.innerHTML = '你五子<em>连珠</em>'; document.getElementById('winSub').textContent = '赢 了 AI · 香'; }
  document.getElementById('winBanner').classList.remove('hidden');
  confetti();
}

function updateUI(){
  document.getElementById('sB').textContent = score.b;
  document.getElementById('sW').textContent = score.w;
  document.getElementById('moveNo').textContent = (mode === 'remote' && rState) ? rState.moveCount : hist.length;
  var chip = document.getElementById('turnChip'), dot = document.getElementById('turnDot'),
      txt = document.getElementById('turnText');
  var hc = humanColor();
  var myTurn = over ? false :
    (mode === 'remote' ? (!!(rState && rState.phase === 'playing' && rMyColor) && rState.turn === rMyColor)
                       : (mode === 'pvp' ? true : turn === hc));
  chip.classList.toggle('me', myTurn && !over);
  dot.style.background = turn === C.BLACK ? '#141412' : '#f5efdd';
  if (over){
    if (mode === 'remote'){
      txt.textContent = rState && rState.winner === 'draw' ? '平局'
        : (rState && rMyColor ? (rState.winner === rMyColor ? '你赢了！' : '你输了') : (turn === C.BLACK ? '黑方胜' : '白方胜'));
    } else {
      txt.textContent = winInfo ? ((turn === C.BLACK ? '黑方胜' : '白方胜')) : '平局';
    }
  } else if (thinking){
    txt.textContent = 'AI 思考中…';
  } else if (mode === 'remote'){
    if (!rState) txt.textContent = '未连接';
    else if (rState.phase === 'waiting') txt.textContent = '等待对手加入…';
    else txt.textContent = myTurn ? (rMyColor === 'black' ? '你执黑 · 请落子' : '你执白 · 请落子') : '等对手落子…';
  } else if (mode === 'pvp'){
    txt.textContent = turn === C.BLACK ? '黑方落子' : '白方落子';
  } else {
    txt.textContent = turn === hc ? (turn === C.BLACK ? '你执黑 · 请落子' : '你执白 · 请落子') : '等待 AI…';
  }
}

function confetti(){
  var colors = ['#EE3A2B','#F4B400','#2D6CDF','#13A87A','#8A5CD7','#F5821F'];
  for (var i=0;i<70;i++){
    var d = document.createElement('div');
    d.className = 'cf';
    d.style.left = Math.random()*100 + 'vw';
    d.style.background = colors[Math.floor(Math.random()*colors.length)];
    d.style.animationDuration = (2.2 + Math.random()*2.2) + 's';
    d.style.animationDelay = (Math.random()*0.6) + 's';
    d.style.transform = 'rotate(' + Math.random()*360 + 'deg)';
    document.body.appendChild(d);
    setTimeout(function(el){ return function(){ el.remove(); }; }(d), 5200);
  }
}

// ============ 远程对战 ============
var rws = null, rState = null, rMyColor = null, rPrevWinner = undefined;

function rShow(msg){ document.getElementById('rHint').textContent = msg; }
function rProto(){ return location.protocol === 'https:' ? 'wss:' : 'ws:'; }

function rConnect(roomId){
  var name = document.getElementById('rName').value.trim() || '玩家';
  try{ localStorage.setItem('booe_gomoku_name', name); }catch(e){}
  if (rws){ try{ rws.close(); }catch(e){} }
  rState = null; rMyColor = null; rPrevWinner = undefined;
  rws = new WebSocket(rProto() + '//' + location.host + '/ws/gomoku/' + roomId);
  rws.onopen = function(){ rws.send(JSON.stringify({ type:'join', name:name })); };
  rws.onmessage = function(e){ var m; try{ m = JSON.parse(e.data); }catch(err){ return; } rHandle(m); };
  rws.onclose = function(){ if (rState && rState.phase === 'playing') rShow('连接断开，请重新加入'); };
  rws.onerror = function(){};
}

function rCreate(){
  var name = document.getElementById('rName').value.trim();
  if (!name){ rShow('先填名字'); return; }
  document.getElementById('rCreate').disabled = true;
  fetch('/api/gomoku/create', { method:'POST' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      document.getElementById('rCreate').disabled = false;
      if (!d.ok){ rShow(d.error || '创建失败'); return; }
      rShow('房间已创建，等待对手…');
      rConnect(d.roomId);
    })
    .catch(function(){ document.getElementById('rCreate').disabled = false; rShow('网络错误'); });
}

function rJoin(){
  var name = document.getElementById('rName').value.trim();
  var rid = document.getElementById('rRoom').value.trim();
  if (!name){ rShow('先填名字'); return; }
  if (!/^\d{4}$/.test(rid)){ rShow('房间号是 4 位数字'); return; }
  rConnect(rid);
}

function rHandle(m){
  if (m.type === 'joined'){
    rMyColor = m.color; // 'black' | 'white' | null(观战)
    if (rState) updateUI(); // 重开换色后即时刷新轮次提示
  } else if (m.type === 'state'){
    // 版本号去重：内容没变就不重绘棋盘（多人进出房间时服务器不会发多余 state，双保险）
    if (rState && rState.rev === m.rev && rState.phase === m.phase && rState.moveCount === m.moveCount) return;
    rState = m;
    rSync();
  } else if (m.type === 'roster'){
    // 轻量名单同步：只更新座位与人数，不动棋盘
    if (!rState) return;
    rState.players = m.players; rState.spectators = m.spectators; rState.phase = m.phase;
    renderSeats(); updateUI();
  } else if (m.type === 'notice'){
    showNotice(m.msg);
  } else if (m.type === 'error'){
    rShow(m.msg);
  }
}

// 顶部横幅提示（比 hint 更醒目）
function showNotice(msg){
  var el = document.getElementById('noticeBar');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(showNotice._t);
  showNotice._t = setTimeout(function(){ el.classList.add('hidden'); }, 6000);
}

// 座位表：明确谁在下棋、谁来观战
function renderSeats(){
  var host = document.getElementById('seats');
  if (!rState){ host.innerHTML = ''; return; }
  var html = '';
  for (var i = 0; i < 2; i++){
    var p = rState.players[i];
    var colorName = i === 0 ? '黑' : '白';
    var dot = i === 0 ? '#141412' : '#f5efdd';
    if (p){
      var isMe = rMyColor === p.color;
      html += '<div class="seat' + (p.connected ? '' : ' off') + '">'
        + '<span class="sdot" style="background:' + dot + (i === 1 ? ';border-color:#999' : '') + '"></span>'
        + '<span class="sname">' + escapeHtmlLite(p.name) + (isMe ? '<em>你</em>' : '') + '</span>'
        + '<span class="scolor">' + colorName + '方</span>'
        + '<span class="sconn">' + (p.connected ? '在线' : '掉线') + '</span>'
        + '</div>';
    } else {
      html += '<div class="seat empty"><span class="sdot ghost"></span><span class="sname">虚位以待</span>'
        + '<span class="scolor">' + colorName + '方</span><span class="sconn"></span></div>';
    }
  }
  host.innerHTML = html;
  var badge = document.getElementById('roleBadge');
  var spect = '观众 ' + (rState.spectators || 0) + ' 人';
  if (rMyColor === 'black') badge.textContent = '你是黑方 · 执黑先行';
  else if (rMyColor === 'white') badge.textContent = '你是白方';
  else badge.textContent = '你是观看者 · 不能落子';
  badge.className = 'role-badge ' + (rMyColor ? 'player' : 'spectator');
  document.getElementById('spectCount').textContent = spect;
}
function escapeHtmlLite(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

function rSync(){
  var m = rState;
  document.getElementById('winBanner').classList.add('hidden');
  board = m.board.map(function(row){
    return (typeof row === 'string') ? row.split('').map(Number) : row.slice();
  });
  turn = m.turn === 'black' ? C.BLACK : C.WHITE;
  winInfo = (m.winLine && m.winLine !== 'draw') ? m.winLine : null;
  over = m.phase === 'ended';
  thinking = false;
  hist = [];
  lastRemote = m.lastMove;

  // 面板显隐：等待/结束显示房间号面板，对局中收起表单只留房间条
  var waiting = (m.phase === 'waiting');
  document.getElementById('remoteBox').classList.toggle('hidden', !waiting);
  document.getElementById('remoteWait').classList.toggle('hidden', !waiting);
  document.getElementById('rRoomNum').textContent = m.roomId;
  if (m.phase === 'ended') document.getElementById('rHint').textContent = '对局结束，点下方「重新开局」黑白互换再来';

  // 胜负横幅 + 计分
  if (m.winner && m.winner !== rPrevWinner){
    if (m.winner === 'black') score.b++; else if (m.winner === 'white') score.w++;
    saveRecord(m); // 写战绩
    if (m.winner !== 'draw'){
      var isMe = rMyColor && m.winner === rMyColor;
      var t = document.getElementById('winTitle');
      t.innerHTML = isMe ? '你五子<em>连珠</em>'
        : (rMyColor ? '对方五子<em>连珠</em>'
                    : ((m.winner === 'black' ? '黑方' : '白方') + ' 五子<em>连珠</em>'));
      document.getElementById('winSub').textContent = isMe ? '远 程 手 谈 · 你 赢 了'
        : (rMyColor ? '再 来 必 翻 盘' : '五 子 连 珠');
      document.getElementById('winBanner').classList.remove('hidden');
      confetti();
    }
  }
  rPrevWinner = m.winner;
  document.getElementById('roomStrip').classList.remove('hidden');
  renderSeats();
  draw(); updateUI();
}

// ---------- 战绩记录（固定名字后自动留存） ----------
var REC_KEY = 'booe_gomoku_records';
function loadRecords(){
  try{
    var raw = localStorage.getItem(REC_KEY);
    var arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function saveRecord(m){
  try{
    var list = loadRecords();
    var me = rMyColor;
    var opp = null;
    (m.players || []).forEach(function(p){ if (me && p.color !== me) opp = p.name; });
    var result = (m.winner === 'draw') ? 'draw' : (me ? (m.winner === me ? 'win' : 'lose') : 'watch');
    list.unshift({
      t: Date.now(),
      room: m.roomId,
      opp: opp || '—',
      color: me === 'black' ? '黑' : (me === 'white' ? '白' : '观战'),
      result: result,
      moves: m.moveCount
    });
    if (list.length > 20) list = list.slice(0, 20);
    localStorage.setItem(REC_KEY, JSON.stringify(list));
    renderRecords();
  }catch(e){}
}
function renderRecords(){
  var list = loadRecords();
  var host = document.getElementById('recList');
  var sum = document.getElementById('recSummary');
  if (!host) return;
  var w = 0, l = 0, d = 0;
  list.forEach(function(r){ if (r.result === 'win') w++; else if (r.result === 'lose') l++; else if (r.result === 'draw') d++; });
  sum.textContent = list.length ? ('近 ' + list.length + ' 局：' + w + ' 胜 ' + l + ' 负 ' + d + ' 平') : '';
  if (!list.length){ host.innerHTML = '<div class="rempty">还没有远程对局记录，赢一局就有了</div>'; return; }
  var html = '';
  list.forEach(function(r){
    var tag = r.result === 'win' ? '<span class="rw win">胜</span>'
      : (r.result === 'lose' ? '<span class="rw lose">负</span>' : '<span class="rw">平</span>');
    var d = new Date(r.t);
    var ds = (d.getMonth() + 1) + '/' + d.getDate() + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    html += '<div class="rec">' + tag
      + '<span class="rmeta">vs ' + escapeHtmlLite(r.opp) + ' · 执' + r.color + ' · ' + r.moves + ' 手 · 房 ' + escapeHtmlLite(String(r.room)) + '</span>'
      + '<span class="rdate">' + ds + '</span></div>';
  });
  host.innerHTML = html;
}

// 离开房间：断开连接，回到表单
function leaveRemote(){
  if (rws){ try{ rws.close(); }catch(e){} }
  rws = null; rState = null; rMyColor = null; rPrevWinner = undefined; lastRemote = null;
  document.getElementById('roomStrip').classList.add('hidden');
  document.getElementById('remoteBox').classList.remove('hidden');
  document.getElementById('remoteWait').classList.add('hidden');
  document.getElementById('winBanner').classList.add('hidden');
  resetState(); draw();
  document.getElementById('hint').textContent = '已离开房间，可重新创建或加入';
  updateUI();
}

// ============ 初始化 ============
cv.addEventListener('click', cvClick);
resetState();
mode = 'pvp';
document.getElementById('btnUndo').disabled = true;
try{
  var savedGk = localStorage.getItem('booe_gomoku_name');
  if (savedGk) document.getElementById('rName').value = savedGk;
}catch(e){}

// ?demo=1 摆一盘中盘局面（供截图/演示）
if (location.search.indexOf('demo=1') > -1){
  var demo = [[7,7],[7,8],[8,8],[6,8],[6,7],[8,7],[8,9],[5,7]];
  demo.forEach(function(p){ place(p[0],p[1]); draw(); });
  turn = C.BLACK;
}

draw(); updateUI();
</script>
