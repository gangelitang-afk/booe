<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#efe8d8">
  <title>来信 · 止一的数字基地</title>
  <meta name="description" content="路过也好，久坐也好。给止一留一句话，让我知道你来过。">
  <link rel="canonical" href="https://booe.xyz/talk.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/digital-base.css">
  <link rel="stylesheet" href="assets/base.css">
  <style>
    .talk-layout {
      display: grid;
      grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
      gap: 36px;
      align-items: start;
    }

    /* 写信纸笺 */
    .letter-pad {
      position: sticky;
      top: 24px;
      background: var(--paper-card);
      border: 1px solid var(--line);
      border-top: 3px solid var(--red);
      padding: 28px 28px 24px;
    }

    .letter-pad__head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 20px;
    }

    .letter-pad__head h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .letter-pad__hint {
      font-family: var(--db-mono);
      font-size: 12px;
      color: var(--muted);
    }

    .field-group {
      margin-bottom: 18px;
    }

    .field-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-soft);
    }

    .field-label small {
      font-family: var(--db-mono);
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
    }

    .letter-input,
    .letter-textarea {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      padding: 10px 2px;
      font-family: var(--db-sans);
      font-size: 15px;
      line-height: 1.8;
      color: var(--ink);
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .letter-textarea {
      min-height: 124px;
      resize: vertical;
      border: 1px solid var(--line);
      background: rgba(239, 232, 216, 0.38);
      padding: 12px 14px;
    }

    .letter-input:focus,
    .letter-textarea:focus {
      outline: none;
      border-color: var(--red);
    }

    .letter-textarea:focus {
      background: #fffcf5;
    }

    .letter-input::placeholder,
    .letter-textarea::placeholder {
      color: rgba(100, 94, 82, 0.56);
    }

    .letter-acts {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
    }

    .letter-feedback {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 30px;
      font-size: 13px;
      color: var(--red);
    }

    .letter-feedback.is-ok {
      color: var(--green);
    }

    .letter-seal[hidden] {
      display: none;
    }

    .submit-btn {
      border: 1px solid var(--red);
      background: var(--red);
      color: #fff8ec;
      padding: 10px 26px;
      font-family: var(--db-sans);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.14em;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .submit-btn:hover:not(:disabled) {
      background: var(--red-deep);
      border-color: var(--red-deep);
    }

    .submit-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .submit-btn:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    /* 来信墙 */
    .wall-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--ink);
    }

    .wall-head h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .wall-count {
      font-family: var(--db-mono);
      font-size: 12px;
      color: var(--muted);
    }

    .msg-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 120px;
    }

    .msg-card {
      padding: 20px 22px;
      background: var(--paper-card);
      border: 1px solid var(--line);
      transition: border-color 0.2s ease;
    }

    .msg-card:hover {
      border-color: rgba(181, 56, 44, 0.45);
    }

    .msg-card__head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .msg-card__name {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      color: var(--ink);
    }

    .msg-card__name::before {
      content: "";
      width: 7px;
      height: 7px;
      background: var(--red);
      flex: none;
    }

    .msg-card__time {
      font-family: var(--db-mono);
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .msg-card__content {
      margin: 0;
      font-size: 15px;
      line-height: 1.85;
      color: var(--ink-soft);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .wall-state {
      padding: 44px 24px;
      text-align: center;
      background: var(--paper-card);
      border: 1px dashed var(--line);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    @media (max-width: 920px) {
      .talk-layout {
        grid-template-columns: 1fr;
        gap: 28px;
      }
      .letter-pad {
        position: static;
        padding: 22px 20px 20px;
      }
    }
  </style>
  <script src="assets/resume-browsing.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <div class="shell">
    <header class="db-header" aria-label="站点页首">
      <a class="db-brand" href="index.html">
        <strong>数字基地</strong>
        <small>止一 · BOOE.XYZ</small>
      </a>
      <nav class="db-nav" aria-label="主导航">
        <a href="gate.html">认识我</a>
        <a href="lab.html">实验室</a>
        <a href="play.html">一起玩</a>
        <a href="talk.html" aria-current="page">来信</a>
      </nav>
    </header>

    <main id="main">
      <div class="db-issue">
        <span><a href="index.html">基地</a> / 来信</span>
        <span>来访即读者 · 留言即来信</span>
      </div>

      <section class="db-page-head">
        <p class="db-kicker">03 / 桌边信箱</p>
        <h1>留一句话，<em>让我知道你来过。</em></h1>
        <p class="db-page-lead">路过打个招呼、对某个专题聊聊看法，或者提议下一个想玩的小游戏，都可以直接落笔。</p>
      </section>

      <div class="talk-layout">
        <section class="letter-pad" aria-labelledby="write-title">
          <div class="letter-pad__head">
            <h2 id="write-title">写一封便笺</h2>
            <span class="letter-pad__hint">Ctrl + Enter 寄出</span>
          </div>

          <form id="guestbookForm" novalidate>
            <div class="field-group">
              <label class="field-label" for="msgName">
                <span>署名</span>
                <small>选填，留空记为匿名</small>
              </label>
              <input class="letter-input" type="text" id="msgName" placeholder="怎么称呼你" maxlength="20" autocomplete="nickname">
            </div>

            <div class="field-group">
              <label class="field-label" for="msgContent">
                <span>正文</span>
                <small id="charCount">0 / 500</small>
              </label>
              <textarea class="letter-textarea" id="msgContent" placeholder="想对止一说什么？" maxlength="500"></textarea>
            </div>

            <div class="letter-acts">
              <div class="letter-feedback" id="feedbackWrap" role="status" aria-live="polite">
                <span class="db-seal letter-seal" id="stampSeal" aria-hidden="true" hidden>已收</span>
                <span id="formMsg"></span>
              </div>
              <button class="submit-btn" id="submitBtn" type="submit">落笔</button>
            </div>
          </form>
        </section>

        <section aria-labelledby="wall-title">
          <div class="wall-head">
            <h2 id="wall-title">近期来信</h2>
            <span class="wall-count" id="wallCount">正在打开留言簿…</span>
          </div>
          <div class="msg-list" id="msgList">
            <div class="wall-state">正在打开留言簿…</div>
          </div>
        </section>
      </div>
    </main>

    <footer class="db-footer" aria-label="站点页脚">
      <div class="db-footer__links">
        <a href="index.html">← 回基地</a>
        <a href="gate.html">认识我</a>
        <a href="lab.html">实验室</a>
        <a href="play.html">一起玩</a>
      </div>
      <span class="db-footer__motto">止一 / BOOE.XYZ</span>
      <a href="#">回到页首 ↑</a>
    </footer>
  </div>

  <script>
    const API = '/api/guestbook';
    const list = document.getElementById('msgList');
    const wallCount = document.getElementById('wallCount');
    const nameInput = document.getElementById('msgName');
    const contentInput = document.getElementById('msgContent');
    const charCount = document.getElementById('charCount');
    const form = document.getElementById('guestbookForm');
    const submitBtn = document.getElementById('submitBtn');
    const feedbackWrap = document.getElementById('feedbackWrap');
    const formMsg = document.getElementById('formMsg');
    const stampSeal = document.getElementById('stampSeal');

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function fmtTime(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return String(iso || '');
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function updateCounter() {
      charCount.textContent = `${contentInput.value.length} / 500`;
    }

    function showStamp() {
      stampSeal.hidden = false;
      stampSeal.classList.remove('db-seal--stamp');
      void stampSeal.offsetWidth;
      stampSeal.classList.add('db-seal--stamp');
    }

    async function loadMessages() {
      try {
        const res = await fetch(API);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        list.innerHTML = '';
        const items = Array.isArray(data.messages) ? data.messages : [];
        wallCount.textContent = `共 ${items.length} 封`;
        if (items.length === 0) {
          list.innerHTML = '<div class="wall-state">还没有来信，来写下第一句吧。</div>';
          return;
        }
        items.forEach(m => {
          const card = document.createElement('article');
          card.className = 'msg-card';
          card.innerHTML = `
            <div class="msg-card__head">
              <span class="msg-card__name">${escapeHtml(m.name)}</span>
              <time class="msg-card__time">${escapeHtml(fmtTime(m.created_at))}</time>
            </div>
            <p class="msg-card__content">${escapeHtml(m.content)}</p>`;
          list.appendChild(card);
        });
      } catch (e) {
        wallCount.textContent = '待连接';
        list.innerHTML = '<div class="wall-state">留言簿当前未连接线上数据库（本地静态预览不会加载 D1 留言记录，线上访问可正常读写）。</div>';
      }
    }

    async function submitMsg(e) {
      if (e) e.preventDefault();
      const name = nameInput.value.trim();
      const content = contentInput.value.trim();

      stampSeal.hidden = true;
      feedbackWrap.classList.remove('is-ok');

      if (!content) {
        formMsg.textContent = '写点什么再落笔';
        contentInput.focus();
        return;
      }

      submitBtn.disabled = true;
      formMsg.textContent = '正在寄出…';

      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name || '匿名', content })
        });
        const data = await res.json();
        if (!data.ok) {
          formMsg.textContent = data.error || '发送失败';
          submitBtn.disabled = false;
          return;
        }
        contentInput.value = '';
        updateCounter();
        feedbackWrap.classList.add('is-ok');
        formMsg.textContent = '留好啦';
        showStamp();
        loadMessages();
      } catch (err) {
        formMsg.textContent = '网络出错，稍后再试';
      }
      submitBtn.disabled = false;
    }

    contentInput.addEventListener('input', updateCounter);
    contentInput.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        submitMsg(e);
      }
    });
    form.addEventListener('submit', submitMsg);

    updateCounter();
    loadMessages();
  </script>
</body>
</html>
