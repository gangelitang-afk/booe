<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>和我聊聊 · 止一的数字基地</title>
<meta name="theme-color" content="#FCFAF3">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Noto+Serif+SC:wght@400;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fonts/mashanzheng.css">
<style>
  :root{
    --paper:#FCFAF3; --ink:#1A1A18; --red:#C0272D; --red-d:#9E2A1F;
    --line:rgba(26,26,24,.16); --gray:#6A6A60; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--paper);color:var(--ink);font-family:'Noto Serif SC',serif;min-height:100vh;}
  body{position:relative;overflow-x:hidden;}
  .grain{position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(rgba(26,26,24,.035) 1px,transparent 1px);background-size:3px 3px;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 40px;position:relative;z-index:1;}

  .back{position:absolute;top:34px;left:40px;z-index:10;color:var(--ink);text-decoration:none;
    font-family:'Noto Sans SC',sans-serif;font-weight:900;font-size:12px;letter-spacing:.3em;
    padding:8px 16px;border:2px solid var(--ink);background:var(--paper);transition:all .25s;}
  .back:hover{background:var(--ink);color:var(--paper);}

  .topbar{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;
    letter-spacing:.28em;color:var(--gray);padding:26px 0 0;}
  .topbar .r{color:var(--red);font-weight:700;}
  .mast{display:flex;align-items:flex-end;justify-content:space-between;padding:14px 0 0;}
  .logo{display:flex;align-items:flex-end;gap:16px;}
  .logo b{font-family:'Ma Shan Zheng',serif;font-weight:400;font-size:84px;line-height:.86;color:var(--red);letter-spacing:.04em;}
  .logo i{font-style:normal;font-family:'Noto Sans SC',sans-serif;font-weight:900;font-size:12px;letter-spacing:.42em;color:var(--ink);padding-bottom:9px;}
  .issue{text-align:right;font-size:12px;letter-spacing:.14em;color:var(--gray);line-height:2;}
  .issue b{display:block;font-family:'Noto Sans SC',sans-serif;font-weight:900;font-size:14px;color:var(--ink);letter-spacing:.1em;}
  .wx{margin-top:18px;}
  .wx .thick{height:5px;background:var(--red);}
  .wx .thin{height:1px;background:var(--ink);margin-top:3px;}

  .page{max-width:780px;margin:0 auto;padding:46px 0 10px;}

  .ph{display:flex;align-items:baseline;gap:16px;margin-bottom:8px;}
  .ph .no{font-family:var(--mono);font-size:11px;color:var(--red);font-weight:700;}
  .ph .nm{font-family:'Noto Sans SC',sans-serif;font-weight:900;font-size:15px;letter-spacing:.3em;}
  .ph .ln{flex:1;height:1px;background:rgba(26,26,24,.3);}
  .ph .pg{font-family:var(--mono);font-size:11px;color:#9A9A90;}

  .title{font-size:clamp(32px,5vw,48px);font-weight:900;line-height:1.3;letter-spacing:.02em;margin-top:18px;}
  .title em{font-style:normal;color:var(--red);}
  .sub{margin-top:12px;font-family:'Noto Sans SC',sans-serif;font-size:13px;letter-spacing:.22em;color:var(--gray);}

  .colhead{display:inline-block;background:var(--red);color:#fff;font-family:'Noto Sans SC',sans-serif;
    font-weight:900;font-size:12px;letter-spacing:.26em;padding:6px 13px;margin:34px 0 18px;}

  .form{border:2px solid var(--ink);padding:22px 24px;margin-bottom:34px;}
  .form .row{display:flex;gap:12px;margin-bottom:12px;}
  .form input{flex:1;border:2px solid var(--ink);background:transparent;padding:11px 14px;font-size:14px;
    font-family:'Noto Sans SC',sans-serif;color:var(--ink);outline:none;transition:border-color .25s;}
  .form input:focus{border-color:var(--red);}
  .form input::placeholder{color:rgba(26,26,24,.35);}
  .form textarea{width:100%;border:2px solid var(--ink);background:transparent;padding:12px 14px;font-size:14px;
    font-family:'Noto Sans SC',sans-serif;color:var(--ink);resize:vertical;min-height:96px;outline:none;transition:border-color .25s;}
  .form textarea:focus{border-color:var(--red);}
  .form textarea::placeholder{color:rgba(26,26,24,.35);}
  .form .acts{margin-top:14px;display:flex;align-items:center;justify-content:space-between;}
  .btn{border:2px solid var(--red);background:var(--red);color:#fff;padding:10px 28px;font-size:14px;
    font-family:'Noto Sans SC',sans-serif;font-weight:900;letter-spacing:.2em;cursor:pointer;transition:all .25s;}
  .btn:hover{background:var(--ink);border-color:var(--ink);}
  .btn:disabled{opacity:.5;cursor:wait;}
  .msg{font-size:12px;color:var(--red);letter-spacing:.1em;font-family:'Noto Sans SC',sans-serif;}

  .list{display:flex;flex-direction:column;gap:14px;min-height:80px;}
  .item{border:2px solid var(--ink);padding:18px 20px;transition:border-color .25s;}
  .item:hover{border-color:var(--red);}
  .ihead{display:flex;align-items:baseline;gap:12px;margin-bottom:8px;}
  .iname{font-family:'Noto Sans SC',sans-serif;font-weight:900;font-size:15px;letter-spacing:.1em;}
  .iname::before{content:'';display:inline-block;width:8px;height:8px;background:var(--red);margin-right:8px;}
  .itime{font-size:11px;color:var(--gray);font-family:var(--mono);}
  .icontent{font-size:14px;line-height:1.85;word-break:break-word;color:#33322C;}
  .empty{text-align:center;padding:50px 0;color:var(--gray);font-size:13px;letter-spacing:.3em;}
  .loading{text-align:center;padding:34px 0;color:var(--gray);font-size:12px;letter-spacing:.3em;}

  .foot{margin:50px 0 44px;}
  .foot .f1{height:1px;background:var(--ink);margin-bottom:3px;}
  .foot .f2{height:3px;background:var(--red);margin-bottom:14px;}
  .foot .row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--gray);}
  .foot .row .r{color:var(--red);font-weight:700;}
  .foot .row a{color:var(--gray);text-decoration:none;}
  .foot .row a:hover{color:var(--red);}

  .fade{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s ease;}
  .fade.in{opacity:1;transform:none;}

  @media (max-width:900px){
    .wrap{padding:0 22px;}
    .back{top:26px;left:22px;padding:7px 13px;font-size:11px;}
    .logo b{font-size:56px;}
    .logo i{font-size:10px;letter-spacing:.32em;}
    .issue{font-size:11px;}
    .page{padding-top:34px;}
    .title{font-size:30px;}
    .form .row{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="grain"></div>

<div class="wrap">
  <a class="back" href="index.html">← 回基地</a>

  <div class="topbar">
    <span>BOOE.XYZ · 止一数字基地</span>
    <span class="r">NO.001 · P05</span>
  </div>
  <div class="mast">
    <div class="logo"><b>不仁</b><i>BU REN</i></div>
    <div class="issue">
      <b>2026 年第 1 期 · 总第 001 期</b>
      主办：<span style="color:var(--red);font-weight:700;">止一</span>　出版：BOOE.XYZ
    </div>
  </div>
  <div class="wx"><div class="thick"></div><div class="thin"></div></div>

  <div class="page">

    <div class="ph fade"><span class="no">05</span><span class="nm">和 我 聊 聊</span><span class="ln"></span><span class="pg">P05</span></div>
    <div class="title fade">留言板 · <em>想说啥说啥</em></div>
    <div class="sub fade">来访即读者，留言即来信。</div>

    <div class="form fade">
      <div class="row">
        <input type="text" id="msgName" placeholder="怎么称呼你" maxlength="20">
      </div>
      <textarea id="msgContent" placeholder="想对止一说什么？" maxlength="500"></textarea>
      <div class="acts">
        <span class="msg" id="formMsg"></span>
        <button class="btn" id="submitBtn" onclick="submitMsg()">落笔</button>
      </div>
    </div>

    <div class="colhead fade">留 言</div>
    <div class="list fade" id="msgList">
      <div class="loading">正在打开留言簿…</div>
    </div>

  </div>

  <div class="foot fade">
    <div class="f1"></div><div class="f2"></div>
    <div class="row">
      <span><a href="index.html">← 回基地</a> · <a href="gate.html">认识我</a> · <a href="lab.html">实验室</a> · <a href="play.html">一起玩</a></span>
      <span class="r">来访 <span id="busuanzi_value_site_uv">0</span> · 定价：无价</span>
    </div>
  </div>

</div>

<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script>
  const API = '/api/guestbook';
  const list = document.getElementById('msgList');

  function fmtTime(iso) {
    const d = new Date(iso);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  async function loadMessages() {
    try {
      const res = await fetch(API);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);
      list.innerHTML = '';
      if (data.messages.length === 0) {
        list.innerHTML = '<div class="empty">还没有留言，来当第一个吧。</div>';
        return;
      }
      data.messages.forEach(m => {
        const item = document.createElement('div');
        item.className = 'item';
        item.innerHTML = `
          <div class="ihead">
            <span class="iname">${escapeHtml(m.name)}</span>
            <span class="itime">${fmtTime(m.created_at)}</span>
          </div>
          <div class="icontent">${escapeHtml(m.content)}</div>`;
        list.appendChild(item);
      });
    } catch (e) {
      list.innerHTML = '<div class="empty">留言板还没接通（数据库未配置）。</div>';
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  async function submitMsg() {
    const name = document.getElementById('msgName').value.trim();
    const content = document.getElementById('msgContent').value.trim();
    const btn = document.getElementById('submitBtn');
    const fm = document.getElementById('formMsg');

    if (!content) { fm.textContent = '写点什么再落笔'; return; }

    btn.disabled = true;
    fm.textContent = '正在落笔…';

    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name || '匿名', content })
      });
      const data = await res.json();
      if (!data.ok) {
        fm.textContent = data.error || '失败';
        btn.disabled = false;
        return;
      }
      document.getElementById('msgContent').value = '';
      fm.textContent = '留好啦';
      loadMessages();
    } catch (e) {
      fm.textContent = '网络出错，稍后再试';
    }
    btn.disabled = false;
  }

  loadMessages();

  var els = document.querySelectorAll('.fade');
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, {threshold:0.06});
  els.forEach(function(el){ io.observe(el); });
</script>
</body>
</html>
