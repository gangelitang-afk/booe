<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅 · 一起玩</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --paper: #EFE8D8; --ink: #16130F; --cinnabar: #C0362C; --ink-mid: rgba(22,19,15,0.55); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: 'Noto Sans SC', sans-serif;
    min-height: 100vh; padding: 6vh 6vw 15vh;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: radial-gradient(rgba(22,19,15,0.03) 1px, transparent 1px);
    background-size: 3px 3px; pointer-events: none; z-index: 0;
  }
  .back {
    position: fixed; top: 4vh; left: 4vw; z-index: 10;
    color: var(--ink); text-decoration: none;
    font-size: 13px; font-weight: 900; letter-spacing: 0.3em;
    padding: 8px 16px; border: 2px solid var(--ink); background: var(--paper);
    transition: all 0.3s;
  }
  .back:hover { background: var(--ink); color: var(--paper); }
  main { max-width: 720px; margin: 0 auto; position: relative; z-index: 1; }
  header { margin-bottom: 8vh; padding-top: 4vh; }
  .page-title { font-family: 'Ma Shan Zheng', serif; font-size: clamp(48px, 8vw, 80px); line-height: 1; margin-bottom: 12px; }
  .page-title .accent { color: var(--cinnabar); }
  .subtitle { font-size: 14px; letter-spacing: 0.35em; color: var(--ink-mid); }

  .section-title {
    font-size: 12px; font-weight: 900; letter-spacing: 0.5em;
    color: var(--cinnabar); margin-bottom: 4vh;
    display: flex; align-items: center; gap: 16px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: rgba(22,19,15,0.15); }

  .game-grid { display: flex; flex-direction: column; gap: 20px; margin-bottom: 8vh; }
  .game-card {
    display: flex; gap: 20px; align-items: center;
    border: 2px solid var(--ink); padding: 22px 24px;
    text-decoration: none; color: var(--ink);
    transition: all 0.3s; position: relative;
  }
  .game-card:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
  .game-icon {
    width: 64px; height: 64px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; border: 2px solid var(--ink);
  }
  .game-icon.hot { background: var(--cinnabar); border-color: var(--cinnabar); }
  .game-info { flex: 1; }
  .game-name { font-size: 20px; font-weight: 900; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
  .game-tag {
    font-size: 10px; font-weight: 900; letter-spacing: 0.15em;
    padding: 3px 8px;
  }
  .tag-multi { background: var(--cinnabar); color: var(--paper); }
  .tag-single { background: var(--ink-mid); color: var(--paper); }
  .game-desc { font-size: 13px; color: var(--ink-mid); line-height: 1.8; }
  .game-arrow { font-size: 24px; font-weight: 900; color: var(--cinnabar); }

  .note {
    margin-top: 4vh; padding: 16px 20px;
    border-left: 3px solid var(--cinnabar);
    font-size: 12px; line-height: 2; color: var(--ink-mid);
    background: rgba(192,54,44,0.04);
  }
  footer { text-align: center; font-size: 11px; letter-spacing: 0.3em; color: var(--ink-mid); margin-top: 10vh; }
  @media (max-width: 640px) {
    body { padding: 8vh 5vw 12vh; }
    .game-icon { width: 52px; height: 52px; font-size: 24px; }
  }
</style>
  <link rel="stylesheet" href="fonts/mashanzheng.css">
</head>
<body>
<a class="back" href="index.html">← 回基地</a>
<main>
  <header>
    <h1 class="page-title">游戏<span class="accent">大厅</span></h1>
    <p class="subtitle">叫上朋友，一起玩</p>
  </header>

  <div class="section-title">多人实时</div>
  <div class="game-grid">
    <a class="game-card" href="ludo.html">
      <div class="game-icon hot">🎲</div>
      <div class="game-info">
        <div class="game-name">飞行棋 <span class="game-tag tag-multi">多人 · 实时</span></div>
        <div class="game-desc">经典 2-4 人桌游。掷骰起飞、踩人回巢、炸弹流星、叠机团灭。创建一个房间，把 4 位房间号发给朋友就能开玩。</div>
      </div>
      <div class="game-arrow">→</div>
    </a>
  </div>

  <div class="section-title">单机</div>
  <div class="game-grid">
    <a class="game-card" href="reflex.html">
      <div class="game-icon">⚡</div>
      <div class="game-info">
        <div class="game-name">眼明手快 <span class="game-tag tag-single">单机</span></div>
        <div class="game-desc">等画面变红的一瞬间点下去，测你的反应速度（毫秒）。最佳纪录存在本地，可以反复挑战自己。</div>
      </div>
      <div class="game-arrow">→</div>
    </a>
  </div>

  <div class="note">
    更多游戏正在制作中：谁是卧底、猜数字、你画我猜……<br>
    飞行棋目前支持 2-4 人，手机打开网址即可加入，无需注册。
  </div>

  <footer>BOOE.XYZ · 止一的数字基地</footer>
</main>
</body>
</html>
