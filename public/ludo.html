<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞行棋 · 一起玩</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --paper: #EFE8D8; --ink: #16130F; --cinnabar: #C0362C; --ink-mid: rgba(22,19,15,0.55); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: 'Noto Sans SC', sans-serif;
    min-height: 100vh;
    padding: 14px 12px 100px;
    position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: radial-gradient(rgba(22,19,15,0.03) 1px, transparent 1px);
    background-size: 3px 3px; pointer-events: none; z-index: 0;
  }
  .back {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    color: var(--ink); text-decoration: none;
    font-size: 12px; font-weight: 900; letter-spacing: 0.2em;
    padding: 6px 12px; border: 2px solid var(--ink); background: var(--paper);
  }
  .back:hover { background: var(--ink); color: var(--paper); }

  .page-title {
    font-family: 'Ma Shan Zheng', serif;
    font-size: 34px; text-align: center; margin: 30px 0 6px;
  }
  .page-sub { text-align: center; font-size: 12px; letter-spacing: 0.3em; color: var(--ink-mid); margin-bottom: 20px; }

  /* ===== 加入界面 ===== */
  .join-box {
    max-width: 380px; margin: 30px auto; text-align: center;
  }
  .join-box .field {
    border: 2px solid var(--ink); background: transparent;
    padding: 12px 16px; font-size: 15px; font-family: inherit;
    width: 100%; margin-bottom: 12px; color: var(--ink); outline: none;
  }
  .join-box .field:focus { border-color: var(--cinnabar); }
  .join-box .row { display: flex; gap: 10px; }
  .join-box .row .field { flex: 1; }
  .btn {
    border: 2px solid var(--ink); background: transparent;
    padding: 12px 20px; font-size: 14px; font-weight: 900;
    letter-spacing: 0.2em; cursor: pointer; font-family: inherit;
    color: var(--ink); transition: all 0.25s;
  }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn.primary { background: var(--cinnabar); border-color: var(--cinnabar); color: var(--paper); }
  .btn.primary:hover { background: var(--ink); border-color: var(--ink); }
  .btn:disabled { opacity: 0.4; cursor: wait; }

  /* ===== 等待界面 ===== */
  .wait-box { max-width: 380px; margin: 0 auto; text-align: center; }
  .room-num {
    font-family: ui-monospace, monospace;
    font-size: 56px; font-weight: 900; letter-spacing: 0.15em;
    border: 3px solid var(--ink); padding: 14px; margin: 10px 0 6px;
    background: rgba(192,54,44,0.06);
  }
  .room-hint { font-size: 12px; color: var(--ink-mid); letter-spacing: 0.2em; margin-bottom: 24px; }
  .player-list { margin: 16px 0 24px; }
  .player-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border: 2px solid var(--ink); margin-bottom: 8px;
    font-size: 14px; font-weight: 700;
  }
  .player-row .dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .player-row .status { margin-left: auto; font-size: 11px; color: var(--ink-mid); font-weight: 400; }
  .player-row.host .tag-host { font-size: 10px; background: var(--cinnabar); color: var(--paper); padding: 2px 6px; margin-left: 6px; }

  /* ===== 游戏界面 ===== */
  .game-box { max-width: 560px; margin: 0 auto; }
  .status-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; font-size: 13px;
  }
  .status-bar .turn {
    font-weight: 900; padding: 6px 12px; border: 2px solid var(--ink);
    background: var(--paper);
  }
  .status-bar .turn.me { background: var(--cinnabar); color: var(--paper); border-color: var(--cinnabar); }
  .status-bar .dice-box {
    display: flex; align-items: center; gap: 8px;
  }
  .dice-face {
    width: 44px; height: 44px; border: 2px solid var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 900; font-family: ui-monospace, monospace;
    background: var(--paper);
  }
  .dice-face.roll { animation: diceShake 0.4s ease-in-out 2; }
  @keyframes diceShake {
    0%,100% { transform: rotate(0); }
    25% { transform: rotate(-12deg) scale(1.1); }
    75% { transform: rotate(12deg) scale(0.95); }
  }

  #board { width: 100%; display: block; background: var(--paper); border: 2px solid var(--ink); }

  .action-bar {
    margin-top: 12px; text-align: center;
  }
  .action-bar .btn { font-size: 16px; padding: 14px 32px; }

  .hint-bar {
    margin-top: 8px; text-align: center;
    font-size: 13px; color: var(--ink-mid); letter-spacing: 0.05em; min-height: 20px;
  }

  .log-box {
    margin-top: 14px; border: 2px solid var(--ink); padding: 10px 12px;
    max-height: 130px; overflow-y: auto; font-size: 12px; line-height: 1.9;
    color: var(--ink-mid); background: rgba(239,232,216,0.5);
  }
  .log-box div:first-child { color: var(--ink); font-weight: 700; }

  /* 棋盘格 */
  .cell { stroke: rgba(22,19,15,0.25); stroke-width: 1; }
  .cell.special { stroke-width: 2; }
  .cell-text { font-size: 15px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .runway { stroke: rgba(22,19,15,0.3); stroke-width: 1; }
  .plane { pointer-events: all; cursor: pointer; }
  .plane.movable { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse {
    0%,100% { r: 11; }
    50% { r: 14; }
  }
  .plane-circle { stroke: #fff; stroke-width: 1.5; }

  .winner-banner {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(22,19,15,0.75);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: var(--paper);
  }
  .winner-banner .w-title {
    font-family: 'Ma Shan Zheng', serif;
    font-size: clamp(40px, 10vw, 80px); margin-bottom: 10px;
  }
  .winner-banner .w-sub { font-size: 14px; letter-spacing: 0.3em; color: rgba(239,232,216,0.8); margin-bottom: 30px; }
  .winner-banner .btn { color: var(--paper); border-color: var(--paper); }
  .winner-banner .btn:hover { background: var(--paper); color: var(--ink); }
  .winner-banner .btn.primary { background: var(--cinnabar); border-color: var(--cinnabar); }

  .toast {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: var(--cinnabar); color: var(--paper);
    padding: 10px 22px; font-size: 13px; font-weight: 700; letter-spacing: 0.1em;
    z-index: 60; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .hidden { display: none !important; }
</style>
  <link rel="stylesheet" href="fonts/mashanzheng.css">
</head>
<body>

<a class="back" href="play.html">← 回大厅</a>

<!-- ===== 加入界面 ===== -->
<div id="joinView">
  <div class="page-title">飞行棋</div>
  <div class="page-sub">多人实时 · 2-4人 · 完整规则</div>
  <div class="join-box">
    <input class="field" id="inpName" placeholder="你的名字" maxlength="12">
    <div class="row">
      <input class="field" id="inpRoom" placeholder="房间号(4位)" maxlength="4" inputmode="numeric">
      <button class="btn primary" id="btnJoin" onclick="joinRoom()">加入</button>
    </div>
    <div style="margin:16px 0;font-size:11px;color:var(--ink-mid);letter-spacing:0.2em;">— 或 —</div>
    <button class="btn" id="btnCreate" onclick="createRoom()">创建房间</button>
  </div>
</div>

<!-- ===== 等待界面 ===== -->
<div id="waitView" class="hidden">
  <div class="page-title">飞行棋</div>
  <div class="wait-box">
    <div class="room-num" id="roomNum">----</div>
    <div class="room-hint">把房间号发给朋友，他们就能加入</div>
    <div class="player-list" id="waitPlayers"></div>
    <button class="btn primary" id="btnStart" onclick="send({type:'start'})">开始游戏</button>
    <div style="margin-top:10px;font-size:11px;color:var(--ink-mid);">至少 2 人才能开始</div>
  </div>
</div>

<!-- ===== 游戏界面 ===== -->
<div id="gameView" class="hidden">
  <div class="page-title" style="font-size:26px;margin:26px 0 2px;">飞行棋 · 房间 <span id="roomNum2" style="font-family:ui-monospace;font-size:20px;"></span></div>
  <div class="game-box">
    <div class="status-bar">
      <span class="turn" id="turnLabel">等待…</span>
      <div class="dice-box">
        <div class="dice-face" id="diceFace">·</div>
      </div>
    </div>
    <svg id="board" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="action-bar">
      <button class="btn primary" id="btnRoll" onclick="send({type:'roll'})">掷骰子</button>
    </div>
    <div class="hint-bar" id="hintBar"></div>
    <div class="log-box" id="logBox"></div>
  </div>
</div>

<!-- 胜利横幅 -->
<div id="winnerBanner" class="winner-banner hidden">
  <div class="w-title" id="winnerName"></div>
  <div class="w-sub">四机全部到达 · 本局获胜</div>
  <button class="btn primary" onclick="send({type:'restart'})">再来一局</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ 常量 ============
const COLORS = {
  red:    { name: '红', hex: '#C0362C', light: '#F2D5D0' },
  yellow: { name: '黄', hex: '#D9A11C', light: '#F5E8C8' },
  blue:   { name: '蓝', hex: '#2E5FA3', light: '#D5E0F2' },
  green:  { name: '绿', hex: '#2E7D46', light: '#D5EAD8' }
};
const START = { red: 39, yellow: 13, blue: 26, green: 0 };
const SPECIAL = {
  jump:  { green: 5,  yellow: 18, blue: 31, red: 44 },
  bomb:  { green: 8,  yellow: 21, blue: 34, red: 47 },
  meteor:{ green: 11, yellow: 24, blue: 37, red: 50 }
};
const DOCK = 0, TRACK_MAX = 52, FINISH = 59;

// ============ 状态 ============
let ws = null;
let roomId = null;
let myId = null;
let myColor = null;
let state = null;
let reconnTimer = null;

const $ = id => document.getElementById(id);

// ============ 创建/加入 ============
async function createRoom() {
  const name = $('inpName').value.trim();
  if (!name) { toast('先填名字'); return; }
  localStorage.setItem('booe_ludo_name', name);
  $('btnCreate').disabled = true;
  try {
    const res = await fetch('/api/ludo/create', { method: 'POST' });
    const data = await res.json();
    if (!data.ok) { toast(data.error || '创建失败'); return; }
    roomId = data.roomId;
    connect();
  } catch (e) { toast('网络错误'); }
  finally { $('btnCreate').disabled = false; }
}

function joinRoom() {
  const name = $('inpName').value.trim();
  const rid = $('inpRoom').value.trim();
  if (!name) { toast('先填名字'); return; }
  if (!/^\d{4}$/.test(rid)) { toast('房间号是 4 位数字'); return; }
  localStorage.setItem('booe_ludo_name', name);
  roomId = rid;
  connect();
}

function connect() {
  const name = localStorage.getItem('booe_ludo_name') || '玩家';
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/ludo/${roomId}`);
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'join', name }));
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    handleMsg(msg);
  };
  ws.onclose = () => {
    if (state && state.phase === 'playing') {
      toast('连接断开，正在重连…');
      scheduleReconnect();
    }
  };
  ws.onerror = () => {};
}

function scheduleReconnect() {
  clearTimeout(reconnTimer);
  reconnTimer = setTimeout(() => {
    try { connect(); } catch (e) {}
  }, 2000);
}

function send(obj) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
}

// ============ 消息处理 ============
function handleMsg(msg) {
  switch (msg.type) {
    case 'joined':
      myId = msg.playerId;
      myColor = msg.color;
      break;
    case 'state':
      state = msg;
      render();
      break;
    case 'error':
      toast(msg.msg);
      break;
  }
}

// ============ 渲染 ============
function render() {
  if (!state) return;

  // 界面切换
  if (state.phase === 'waiting') {
    $('joinView').classList.add('hidden');
    $('gameView').classList.add('hidden');
    $('waitView').classList.remove('hidden');
    renderWaiting();
  } else {
    $('joinView').classList.add('hidden');
    $('waitView').classList.add('hidden');
    $('gameView').classList.remove('hidden');
    renderGame();
  }
}

function renderWaiting() {
  $('roomNum').textContent = state.roomId;
  const list = $('waitPlayers');
  list.innerHTML = '';
  state.players.forEach((p, i) => {
    const c = COLORS[p.color];
    const row = document.createElement('div');
    row.className = 'player-row';
    row.innerHTML = `
      <span class="dot" style="background:${c.hex}"></span>
      <span>${p.name}</span>
      ${i === 0 ? '<span class="tag-host">房主</span>' : ''}
      ${p.id === myId ? '<span style="margin-left:4px;font-size:10px;color:var(--cinnabar)">(你)</span>' : ''}
      <span class="status">${p.connected ? '在线' : '掉线'}</span>`;
    list.appendChild(row);
  });
  const isHost = state.players[0] && state.players[0].id === myId;
  $('btnStart').style.display = isHost ? '' : 'none';
}

function renderGame() {
  $('roomNum2').textContent = state.roomId;
  renderTurn();
  renderDice();
  renderBoard();
  renderLog();
  renderWinner();
}

function renderTurn() {
  const cur = state.players[state.current];
  const el = $('turnLabel');
  if (!cur) { el.textContent = '等待…'; return; }
  const isMe = cur.id === myId;
  el.textContent = isMe ? '轮到你' : `轮到 ${cur.name}`;
  el.className = 'turn' + (isMe ? ' me' : '');
}

function renderDice() {
  const d = state.dice;
  $('diceFace').textContent = d === null ? '·' : d;
  // 掷骰按钮状态
  const cur = state.players[state.current];
  const isMeTurn = cur && cur.id === myId;
  const canRoll = state.phase === 'playing' && isMeTurn && state.turnStage === 'roll';
  $('btnRoll').disabled = !canRoll;
  $('btnRoll').style.display = canRoll ? '' : 'none';
}

function renderLog() {
  const box = $('logBox');
  box.innerHTML = '';
  (state.log || []).slice().reverse().forEach(t => {
    const div = document.createElement('div');
    div.textContent = t;
    box.appendChild(div);
  });
}

function renderWinner() {
  if (state.phase === 'ended' && state.winner !== null) {
    const w = state.players[state.winner];
    $('winnerName').textContent = w ? `${w.name} 获胜！` : '游戏结束';
    $('winnerBanner').classList.remove('hidden');
  } else {
    $('winnerBanner').classList.add('hidden');
  }
}

// ============ 棋盘 ============
function buildBoardSVG() {
  const svg = $('board');
  svg.innerHTML = '';
  const NS = 'http://www.w3.org/2000/svg';
  const G = 32; // 格子大小
  const cells = [];
  const edges = { green: 'top', yellow: 'right', blue: 'bottom', red: 'left' };

  // 计算主路格子坐标
  function cellCoords(abs) {
    // 上边 0-12, 右边 13-25, 下边 26-38, 左边 39-51
    if (abs <= 12) return { x: 128 + abs * G, y: 128 };          // 上（左→右）
    if (abs <= 25) return { x: 512, y: 128 + (abs - 13) * G };    // 右（上→下）
    if (abs <= 38) return { x: 512 - (abs - 26) * G, y: 512 };    // 下（右→左）
    return { x: 128, y: 512 - (abs - 39) * G };                   // 左（下→上）
  }
  function absColor(abs) {
    if (abs <= 12) return 'green';
    if (abs <= 25) return 'yellow';
    if (abs <= 38) return 'blue';
    return 'red';
  }

  // 主路格子
  for (let abs = 0; abs < 52; abs++) {
    const { x, y } = cellCoords(abs);
    const color = absColor(abs);
    const c = COLORS[color];
    let cls = 'cell';
    let mark = null;
    if (SPECIAL.jump[color] === abs) { cls += ' special'; mark = '↗'; }
    else if (SPECIAL.bomb[color] === abs) { cls += ' special'; mark = '💣'; }
    else if (SPECIAL.meteor[color] === abs) { cls += ' special'; mark = '⭐'; }
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', x); rect.setAttribute('y', y);
    rect.setAttribute('width', G); rect.setAttribute('height', G);
    rect.setAttribute('fill', c.light);
    rect.setAttribute('class', cls);
    rect.dataset.abs = abs;
    svg.appendChild(rect);
    if (mark) {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', x + G/2); t.setAttribute('y', y + G/2);
      t.setAttribute('class', 'cell-text');
      t.setAttribute('font-size', mark === '↗' ? 20 : 16);
      t.textContent = mark;
      svg.appendChild(t);
    }
  }

  // 终点跑道（每色 6 格，从主路内缘到中央）
  const runways = {
    green:  { x0: 320, y0: 192, dx: 0,   dy: G },   // 上边向下
    yellow: { x0: 448, y0: 320, dx: -G,  dy: 0 },   // 右边向左
    blue:   { x0: 320, y0: 448, dx: 0,   dy: -G },  // 下边向上
    red:    { x0: 192, y0: 320, dx: G,   dy: 0 }    // 左边向右
  };
  for (const color of ['green', 'yellow', 'blue', 'red']) {
    const r = runways[color];
    const c = COLORS[color];
    for (let i = 0; i < 6; i++) {
      const rect = document.createElementNS(NS, 'rect');
      rect.setAttribute('x', r.x0 + r.dx * i);
      rect.setAttribute('y', r.y0 + r.dy * i);
      rect.setAttribute('width', G); rect.setAttribute('height', G);
      rect.setAttribute('fill', c.light);
      rect.setAttribute('class', 'runway');
      svg.appendChild(rect);
      // 跑道箭头
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', r.x0 + r.dx * i + G/2);
      t.setAttribute('y', r.y0 + r.dy * i + G/2);
      t.setAttribute('class', 'cell-text');
      t.setAttribute('font-size', 11);
      t.textContent = i + 1;
      t.setAttribute('fill', c.hex);
      svg.appendChild(t);
    }
  }

  // 停机坪（四角）
  const docks = {
    green:  { x: 0,  y: 0 },   // 左上
    yellow: { x: 512, y: 0 },  // 右上
    blue:   { x: 512, y: 512 },// 右下
    red:    { x: 0,  y: 512 }  // 左下
  };
  for (const color of ['green', 'yellow', 'blue', 'red']) {
    const d = docks[color];
    const c = COLORS[color];
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', d.x); rect.setAttribute('y', d.y);
    rect.setAttribute('width', 128); rect.setAttribute('height', 128);
    rect.setAttribute('fill', c.light);
    rect.setAttribute('class', 'runway');
    svg.appendChild(rect);
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', d.x + 64); t.setAttribute('y', d.y + 40);
    t.setAttribute('class', 'cell-text');
    t.setAttribute('font-size', 13);
    t.setAttribute('fill', c.hex);
    t.textContent = `${c.name} 停机坪`;
    svg.appendChild(t);
    const t2 = document.createElementNS(NS, 'text');
    t2.setAttribute('x', d.x + 64); t2.setAttribute('y', d.y + 64);
    t2.setAttribute('class', 'cell-text');
    t2.setAttribute('font-size', 11);
    t2.setAttribute('fill', 'rgba(22,19,15,0.4)');
    t2.textContent = '掷6起飞';
    svg.appendChild(t2);
  }

  // 中央装饰
  const ctext = document.createElementNS(NS, 'text');
  ctext.setAttribute('x', 320); ctext.setAttribute('y', 300);
  ctext.setAttribute('class', 'cell-text');
  ctext.setAttribute('font-family', "'Ma Shan Zheng',serif");
  ctext.setAttribute('font-size', 40);
  ctext.textContent = '飞行棋';
  svg.appendChild(ctext);
  const csub = document.createElementNS(NS, 'text');
  csub.setAttribute('x', 320); csub.setAttribute('y', 350);
  csub.setAttribute('class', 'cell-text');
  csub.setAttribute('font-size', 12);
  csub.setAttribute('fill', 'rgba(22,19,15,0.4)');
  csub.textContent = 'LUDO · 2-4人';
  svg.appendChild(csub);
}

// ============ 飞机渲染 ============
function planePos(color, pos) {
  // 返回 SVG 中心坐标
  if (pos === DOCK) {
    const docks = {
      green:  { x: 0,  y: 0 },
      yellow: { x: 512, y: 0 },
      blue:   { x: 512, y: 512 },
      red:    { x: 0,  y: 512 }
    };
    const d = docks[color];
    return { x: d.x + 32, y: d.y + 96 };
  }
  if (pos >= 53 && pos <= 58) {
    // 终点跑道：跑道位置 1-6
    const step = pos - 52; // 1-6
    const runways = {
      green:  { x0: 320, y0: 192, dx: 0,  dy: 32 },
      yellow: { x0: 448, y0: 320, dx: -32, dy: 0 },
      blue:   { x0: 320, y0: 448, dx: 0,  dy: -32 },
      red:    { x0: 192, y0: 320, dx: 32, dy: 0 }
    };
    const r = runways[color];
    return { x: r.x0 + r.dx * (step-1) + 16, y: r.y0 + r.dy * (step-1) + 16 };
  }
  // 主路
  const G = 32;
  const abs = (START[color] + pos - 1) % 52;
  let x, y;
  if (abs <= 12) { x = 128 + abs * G + 16; y = 144; }
  else if (abs <= 25) { x = 528; y = 128 + (abs - 13) * G + 16; }
  else if (abs <= 38) { x = 512 - (abs - 26) * G + 16; y = 528; }
  else { x = 144; y = 512 - (abs - 39) * G + 16; }
  return { x, y };
}

function renderBoard() {
  buildBoardSVG();
  const svg = $('board');
  const NS = 'http://www.w3.org/2000/svg';
  const movableSet = new Set(state.movable || []);

  state.players.forEach((p, idx) => {
    const c = COLORS[p.color];
    // 停机坪内飞机
    p.planes.forEach((pos, planeIdx) => {
      if (pos === DOCK) {
        // 4 架停在停机坪，错开排列
        const docks = {
          green:  { x: 0,  y: 0 },
          yellow: { x: 512, y: 0 },
          blue:   { x: 512, y: 512 },
          red:    { x: 0,  y: 512 }
        };
        const d = docks[p.color];
        const px = d.x + 24 + (planeIdx % 2) * 36;
        const py = d.y + 88 + Math.floor(planeIdx / 2) * 24;
        drawPlane(svg, NS, px, py, c.hex, planeIdx, false);
        return;
      }
      const { x, y } = planePos(p.color, pos);
      const isMe = p.id === myId;
      const movable = isMe && movableSet.has(planeIdx);
      drawPlane(svg, NS, x, y, c.hex, planeIdx, movable);
    });
  });
}

function drawPlane(svg, NS, x, y, color, idx, movable) {
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'plane' + (movable ? ' movable' : ''));
  g.dataset.plane = idx;
  if (movable) {
    g.style.cursor = 'pointer';
    g.addEventListener('click', () => send({ type: 'move', plane: idx }));
  }
  const circle = document.createElementNS(NS, 'circle');
  circle.setAttribute('cx', x); circle.setAttribute('cy', y);
  circle.setAttribute('r', movable ? 11 : 9);
  circle.setAttribute('fill', color);
  circle.setAttribute('class', 'plane-circle');
  g.appendChild(circle);
  const label = document.createElementNS(NS, 'text');
  label.setAttribute('x', x); label.setAttribute('y', y + 3);
  label.setAttribute('class', 'cell-text');
  label.setAttribute('font-size', 9);
  label.setAttribute('fill', '#fff');
  label.textContent = idx + 1;
  g.appendChild(label);
  svg.appendChild(g);
}

// ============ 提示 ============
function updateHint() {
  const bar = $('hintBar');
  if (!state || state.phase === 'waiting') { bar.textContent = ''; return; }
  const cur = state.players[state.current];
  const isMe = cur && cur.id === myId;
  if (state.phase === 'ended') { bar.textContent = '游戏结束'; return; }
  if (!isMe) { bar.textContent = `等待 ${cur.name} 操作…`; return; }
  if (state.turnStage === 'roll') { bar.textContent = '点击「掷骰子」'; return; }
  if (state.movable && state.movable.length > 0) { bar.textContent = '点击一架高亮的飞机移动'; return; }
  bar.textContent = '';
}

function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2200);
}

// 名字预填
(function init() {
  const saved = localStorage.getItem('booe_ludo_name');
  if (saved) $('inpName').value = saved;
  // 响应式刷新
  window.addEventListener('resize', () => { if (state && state.phase !== 'waiting') renderBoard(); });
  // 定时更新提示
  setInterval(updateHint, 500);
})();
</script>
