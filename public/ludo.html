<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>飞行棋 · 一起玩</title>
<meta name="theme-color" content="#EE3A2B">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fonts/mashanzheng.css">
<style>
  :root{
    --paper:#FAF4E6; --ink:#1A1A18; --red:#EE3A2B; --ink-mid:#6A6A60;
    --c-yellow:#F4B400; --c-blue:#2D6CDF; --c-green:#13A87A;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--paper);color:var(--ink);font-family:'Noto Sans SC',sans-serif;
    min-height:100vh;padding:14px 12px 90px;position:relative;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(rgba(26,26,24,.04) 1px,transparent 1px);background-size:3px 3px;}
  .back{position:fixed;top:12px;left:12px;z-index:10;color:var(--ink);text-decoration:none;
    font-size:12px;font-weight:900;letter-spacing:.2em;padding:7px 13px;
    border:2px solid var(--ink);background:var(--paper);}
  .back:hover{background:var(--ink);color:var(--paper);}

  .head{text-align:center;margin:42px 0 6px;position:relative;}
  .head .badge{display:inline-block;background:var(--ink);color:var(--paper);font-weight:900;font-size:10px;
    letter-spacing:.28em;padding:5px 12px;transform:rotate(-3deg);}
  .head h1{font-family:'Ma Shan Zheng',serif;font-weight:400;font-size:46px;line-height:1.1;margin:10px 0 2px;color:var(--red);}
  .head .sub{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--ink-mid);}

  /* 加入 / 等待 */
  .box{max-width:400px;margin:22px auto;text-align:center;}
  .box .field{border:3px solid var(--ink);background:#fff;padding:13px 16px;font-size:15px;
    font-family:inherit;width:100%;margin-bottom:12px;color:var(--ink);outline:none;font-weight:700;}
  .box .field:focus{border-color:var(--red);}
  .box .row{display:flex;gap:10px;}
  .box .row .field{flex:1;}
  .btn{border:2px solid var(--ink);background:#fff;color:var(--ink);padding:13px 22px;font-size:14px;
    font-weight:900;letter-spacing:.2em;cursor:pointer;font-family:inherit;transition:all .15s;}
  .btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink);}
  .btn.primary{background:var(--red);border-color:var(--red);color:#fff;}
  .btn:disabled{opacity:.45;cursor:wait;transform:none;box-shadow:none;}
  .room-num{font-family:var(--mono);font-size:54px;font-weight:900;letter-spacing:.15em;
    border:3px solid var(--ink);padding:14px;margin:10px 0 6px;background:#fff;
    box-shadow:6px 6px 0 rgba(238,58,43,.25);color:var(--red);}
  .room-hint{font-size:12px;color:var(--ink-mid);letter-spacing:.2em;margin-bottom:20px;}
  .player-list{margin:14px 0 22px;}
  .player-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border:2px solid var(--ink);
    margin-bottom:8px;font-size:14px;font-weight:700;background:#fff;}
  .player-row .dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:2px solid rgba(26,26,24,.35);}
  .player-row .status{margin-left:auto;font-size:11px;color:var(--ink-mid);font-weight:400;}
  .tag-host{font-size:10px;background:var(--red);color:#fff;padding:2px 7px;margin-left:6px;}

  /* 游戏界面 */
  .game-box{max-width:580px;margin:0 auto;}
  .roster{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;justify-content:center;}
  .chip{display:flex;align-items:center;gap:6px;border:2px solid var(--ink);background:#fff;
    padding:5px 10px;font-size:12px;font-weight:900;}
  .chip .dot{width:11px;height:11px;border-radius:50%;border:2px solid rgba(26,26,24,.3);}
  .chip.cur{background:var(--ink);color:var(--paper);box-shadow:3px 3px 0 rgba(238,58,43,.3);}
  .chip .fin{font-family:var(--mono);font-size:10px;color:var(--ink-mid);}
  .chip.cur .fin{color:var(--c-yellow);}

  .status-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;
    background:#fff;border:2px solid var(--ink);padding:8px 12px;box-shadow:4px 4px 0 rgba(26,26,24,.12);}
  .turn{font-weight:900;font-size:15px;padding:4px 2px;line-height:1.2;}
  .turn.me{color:var(--red);}
  .dice-wrap{display:flex;align-items:center;gap:8px;}
  .dice{width:46px;height:46px;border:2.5px solid var(--ink);background:#fff;position:relative;
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:6px;flex-shrink:0;}
  .dice .pip{width:7px;height:7px;border-radius:50%;background:var(--red);align-self:center;justify-self:center;}
  .dice .pip.off{visibility:hidden;}
  .dice.roll{animation:diceShake .4s ease-in-out 2;}
  .dice.six{animation:diceSix .55s ease-out 2;box-shadow:0 0 0 3px var(--c-yellow),0 0 16px 4px rgba(244,180,0,.7);}
  .dice-num{font-family:var(--mono);font-weight:900;font-size:30px;min-width:26px;text-align:center;color:var(--ink);}
  .dice-num.six{color:var(--c-yellow);text-shadow:0 0 8px rgba(244,180,0,.8);}

  #board{width:100%;display:block;background:var(--paper);border:3px solid var(--ink);
    box-shadow:7px 7px 0 rgba(26,26,24,.16);touch-action:manipulation;}

  .action-bar{margin-top:14px;text-align:center;}
  .action-bar .btn{font-size:17px;padding:15px 40px;}
  .hint-bar{margin-top:10px;text-align:center;font-size:14px;font-weight:700;color:var(--ink-mid);min-height:22px;}
  .hint-bar.go{color:var(--red);}
  .rule-tip{margin-top:8px;text-align:center;font-size:11px;color:var(--ink-mid);line-height:1.6;letter-spacing:.04em;}
  .log-box{margin-top:14px;border:2px solid var(--ink);padding:10px 12px;max-height:120px;overflow-y:auto;
    font-size:12px;line-height:1.9;color:var(--ink-mid);background:#fff;}
  .log-box div:first-child{color:var(--ink);font-weight:700;}

  /* 棋盘 SVG */
  .cell{stroke:rgba(26,26,24,.4);stroke-width:1.4;}
  .cell-text{text-anchor:middle;dominant-baseline:central;pointer-events:none;}
  .runway{stroke:rgba(26,26,24,.4);stroke-width:1.4;}

  .plane{transition:transform .45s cubic-bezier(.34,1.25,.64,1);pointer-events:none;}
  .plane .hit{fill:transparent;pointer-events:all;cursor:default;}
  .plane.movable{pointer-events:none;}
  .plane.movable .hit{cursor:pointer;pointer-events:all;}
  .plane .body{stroke:#fff;stroke-width:2;}
  .plane .glyph{pointer-events:none;}
  .plane .ring{pointer-events:none;opacity:0;}
  .plane .tap{pointer-events:none;opacity:0;font-family:'Noto Sans SC',sans-serif;font-weight:900;}
  .plane.movable .ring{opacity:1;animation:ringPulse 1s ease-in-out infinite;}
  .plane.movable .tap{opacity:1;animation:tapBob .9s ease-in-out infinite;}
  .plane.movable .inner{animation:planeBob .9s ease-in-out infinite;}
  .plane.launch .inner{animation:launchPop .55s ease-out;}
  .plane.kicked .inner{animation:kickShake .5s ease-in-out;}
  .plane.kicked .body{animation:redFlash .55s ease-out;}

  /* 特效层 */
  .fx-layer{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden;}
  .burst{position:absolute;width:18px;height:18px;border-radius:50%;border:4px solid #fff;
    transform:translate(-50%,-50%);animation:ringExpand .7s ease-out forwards;}
  .float{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:20px;white-space:nowrap;
    text-shadow:0 2px 4px rgba(0,0,0,.3);animation:floatUp 1.1s ease-out forwards;}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:55;opacity:0;
    box-shadow:inset 0 0 120px 30px rgba(238,58,43,.85);}
  #flash.go{animation:screenFlash .6s ease-out;}

  .winner-banner{position:fixed;inset:0;z-index:70;background:rgba(26,26,24,.8);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--paper);}
  .winner-banner .w-title{font-family:'Ma Shan Zheng',serif;font-size:clamp(40px,10vw,80px);}
  .winner-banner .w-title em{font-style:normal;color:var(--c-yellow);}
  .winner-banner .w-sub{font-size:13px;letter-spacing:.3em;color:rgba(250,244,230,.75);margin:12px 0 30px;}
  .winner-banner .btn{color:var(--paper);border-color:var(--paper);background:transparent;}
  .winner-banner .btn:hover{background:var(--paper);color:var(--ink);box-shadow:none;}
  .winner-banner .btn.primary{background:var(--red);border-color:var(--red);}

  .cf{position:fixed;top:-16px;width:9px;height:14px;z-index:65;pointer-events:none;animation:cfFall linear forwards;}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;
    padding:10px 22px;font-size:13px;font-weight:700;letter-spacing:.1em;z-index:80;
    opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:4px 4px 0 rgba(26,26,24,.3);max-width:90vw;text-align:center;}
  .toast.show{opacity:1;}
  .hidden{display:none !important;}

  @keyframes diceShake{0%,100%{transform:rotate(0);}25%{transform:rotate(-14deg) scale(1.12);}75%{transform:rotate(14deg) scale(.94);}}
  @keyframes diceSix{0%{transform:scale(1);}40%{transform:scale(1.25) rotate(8deg);}100%{transform:scale(1);}}
  @keyframes ringPulse{0%,100%{transform:scale(1);opacity:.9;}50%{transform:scale(1.7);opacity:0;}}
  @keyframes tapBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  @keyframes planeBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  @keyframes launchPop{0%{transform:scale(1);}45%{transform:scale(1.5) translateY(-6px);}100%{transform:scale(1);}}
  @keyframes kickShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-5px) rotate(-8deg);}40%{transform:translateX(5px) rotate(8deg);}60%{transform:translateX(-4px) rotate(-6deg);}80%{transform:translateX(4px) rotate(6deg);}}
  @keyframes redFlash{0%,100%{fill:inherit;}30%,70%{fill:#EE3A2B;}}
  @keyframes ringExpand{0%{transform:translate(-50%,-50%) scale(.4);opacity:.95;}100%{transform:translate(-50%,-50%) scale(3.4);opacity:0;}}
  @keyframes floatUp{0%{transform:translate(-50%,-50%) scale(.6);opacity:0;}20%{opacity:1;transform:translate(-50%,-90%) scale(1.1);}100%{transform:translate(-50%,-180%) scale(1);opacity:0;}}
  @keyframes screenFlash{0%{opacity:0;}20%{opacity:1;}100%{opacity:0;}}
  @keyframes cfFall{0%{transform:translateY(0) rotate(0);}100%{transform:translateY(105vh) rotate(720deg);}}
</style>
</head>
<body>

<a class="back" href="index.html#play">← 回基地</a>

<!-- 加入界面 -->
<div id="joinView">
  <div class="head">
    <div class="badge">多 人 实 时</div>
    <h1>飞行棋</h1>
    <div class="sub">LUDO · 2-4 人 · 掷骰起飞 · 踩人回巢</div>
  </div>
  <div class="box">
    <input class="field" id="inpName" placeholder="你的名字" maxlength="12">
    <div class="row">
      <input class="field" id="inpRoom" placeholder="房间号(4位)" maxlength="4" inputmode="numeric">
      <button class="btn primary" id="btnJoin" onclick="sendJoin()">加入</button>
    </div>
    <div style="margin:16px 0;font-size:11px;color:var(--ink-mid);letter-spacing:.2em;">— 或 —</div>
    <button class="btn" id="btnCreate" onclick="createRoom()">创建房间</button>
    <button class="btn" id="btnSolo" onclick="enterDemo()" style="margin-top:10px;">单人试玩 · 不用等人</button>
  </div>
</div>

<!-- 等待界面 -->
<div id="waitView" class="hidden">
  <div class="box">
    <div class="room-num" id="roomNum">----</div>
    <div class="room-hint">把房间号发给朋友，他们就能加入</div>
    <div class="player-list" id="waitPlayers"></div>
    <button class="btn primary" id="btnStart" onclick="send({type:'start'})">开始游戏</button>
    <div style="margin-top:10px;font-size:11px;color:var(--ink-mid);">至少 2 人才能开始</div>
  </div>
</div>

<!-- 游戏界面 -->
<div id="gameView" class="hidden">
  <div class="head" style="margin-top:46px;">
    <h1 style="font-size:30px;">飞行棋</h1>
    <div class="sub">房间 <span id="roomNum2" style="color:var(--red);font-weight:700;">----</span></div>
  </div>
  <div class="game-box">
    <div class="roster" id="roster"></div>
    <div class="status-bar">
      <span class="turn" id="turnLabel">等待…</span>
      <div class="dice-wrap">
        <div class="dice" id="dice"></div>
        <div class="dice-num" id="diceNum">–</div>
      </div>
    </div>
    <svg id="board" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="action-bar">
      <button class="btn primary" id="btnRoll" onclick="send({type:'roll'})">掷骰子</button>
    </div>
    <div class="hint-bar" id="hintBar"></div>
    <div class="rule-tip">掷 6 才能起飞（并再掷一次）· 踩到敌方飞机将其踢回停机坪 · 四架先全部到达者获胜</div>
    <div class="log-box" id="logBox"></div>
  </div>
</div>

<!-- 胜利横幅 -->
<div id="winnerBanner" class="winner-banner hidden">
  <div class="w-title" id="winnerName"></div>
  <div class="w-sub">四机全部到达 · 本局获胜</div>
  <button class="btn primary" onclick="send({type:'restart'})">再来一局</button>
</div>

<div class="fx-layer" id="fxLayer"></div>
<div id="flash"></div>
<div class="toast" id="toast"></div>

<script>
// ============ 常量 ============
const COLORS = {
  red:    { name: '红', hex: '#EE3A2B', light: '#FBDFDB' },
  yellow: { name: '黄', hex: '#F4B400', light: '#FCEEC9' },
  blue:   { name: '蓝', hex: '#2D6CDF', light: '#DCE6FA' },
  green:  { name: '绿', hex: '#13A87A', light: '#D2EFE3' }
};
const START = { red: 39, yellow: 13, blue: 26, green: 0 };
const SPECIAL = {
  jump:  { green: 5,  yellow: 18, blue: 31, red: 44 },
  bomb:  { green: 8,  yellow: 21, blue: 34, red: 47 },
  meteor:{ green: 11, yellow: 24, blue: 37, red: 50 }
};
const DOCK = 0, TRACK_MAX = 52, FINISH = 59;

// ============ 状态 ============
let ws = null, roomId = null, myId = null, myColor = null, state = null, reconnTimer = null;
let lastDice = null, lastFxSeq = 0, boardReady = false, demoSeq = 0;
const planeEls = {}; // key: playerId_planeIdx -> <g>
const $ = id => document.getElementById(id);

// ============ 创建/加入 ============
async function createRoom() {
  const name = $('inpName').value.trim();
  if (!name) { toast('先填名字'); return; }
  localStorage.setItem('booe_ludo_name', name);
  $('btnCreate').disabled = true;
  try {
    const res = await fetch('/api/ludo/create', { method: 'POST' });
    const data = await res.json();
    if (!data.ok) { toast(data.error || '创建失败'); return; }
    roomId = data.roomId;
    connect();
  } catch (e) { toast('网络错误'); }
  finally { $('btnCreate').disabled = false; }
}

function sendJoin() {
  const name = $('inpName').value.trim();
  const rid = $('inpRoom').value.trim();
  if (!name) { toast('先填名字'); return; }
  if (!/^\d{4}$/.test(rid)) { toast('房间号是 4 位数字'); return; }
  localStorage.setItem('booe_ludo_name', name);
  roomId = rid;
  connect();
}

function connect() {
  const name = localStorage.getItem('booe_ludo_name') || '玩家';
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/ludo/${roomId}`);
  ws.onopen = () => { ws.send(JSON.stringify({ type: 'join', name })); };
  ws.onmessage = (e) => { handleMsg(JSON.parse(e.data)); };
  ws.onclose = () => {
    if (state && state.phase === 'playing') { toast('连接断开，正在重连…'); scheduleReconnect(); }
  };
  ws.onerror = () => {};
}
function scheduleReconnect() {
  clearTimeout(reconnTimer);
  reconnTimer = setTimeout(() => { try { connect(); } catch (e) {} }, 2000);
}
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

// ============ 消息处理 ============
function handleMsg(msg) {
  switch (msg.type) {
    case 'joined': myId = msg.playerId; myColor = msg.color; break;
    case 'state': state = msg; render(); break;
    case 'error': toast(msg.msg); break;
  }
  if (window.__ludoTest) window.__ludoTest.lastMsg = msg;
}

// ============ 渲染 ============
function render() {
  if (!state) return;
  if (state.phase === 'waiting') {
    $('joinView').classList.add('hidden');
    $('gameView').classList.add('hidden');
    $('waitView').classList.remove('hidden');
    renderWaiting();
  } else {
    $('joinView').classList.add('hidden');
    $('waitView').classList.add('hidden');
    $('gameView').classList.remove('hidden');
    renderGame();
  }
  if (window.__ludoTest) window.__ludoTest.state = state;
}

function renderWaiting() {
  $('roomNum').textContent = state.roomId;
  const list = $('waitPlayers');
  list.innerHTML = '';
  state.players.forEach((p, i) => {
    const c = COLORS[p.color];
    const row = document.createElement('div');
    row.className = 'player-row';
    row.innerHTML = `
      <span class="dot" style="background:${c.hex}"></span>
      <span>${escapeHtml(p.name)}</span>
      ${i === 0 ? '<span class="tag-host">房主</span>' : ''}
      ${p.id === myId ? '<span style="margin-left:4px;font-size:10px;color:var(--red)">(你)</span>' : ''}
      <span class="status">${p.connected ? '在线' : '掉线'}</span>`;
    list.appendChild(row);
  });
  const isHost = state.players[0] && state.players[0].id === myId;
  $('btnStart').style.display = isHost ? '' : 'none';
}

function renderGame() {
  if (!boardReady) buildStaticBoard();
  $('roomNum2').textContent = state.roomId;
  renderRoster();
  renderTurn();
  renderDice();
  renderBoardPlanes();
  renderLog();
  renderWinner();
  renderFx(state.fx);
}

function renderRoster() {
  const box = $('roster');
  box.innerHTML = '';
  state.players.forEach((p, i) => {
    const c = COLORS[p.color];
    const fin = p.planes.filter(pos => pos === FINISH).length;
    const chip = document.createElement('span');
    chip.className = 'chip' + (i === state.current && state.phase === 'playing' ? ' cur' : '');
    chip.innerHTML = `<span class="dot" style="background:${c.hex}"></span>` +
      `${escapeHtml(p.name)}<span class="fin">🏁${fin}</span>`;
    box.appendChild(chip);
  });
}

function renderTurn() {
  const cur = state.players[state.current];
  const el = $('turnLabel');
  if (!cur) { el.textContent = '等待…'; el.className = 'turn'; return; }
  const isMe = cur.id === myId;
  el.textContent = isMe ? '轮到你！' : `轮到 ${cur.name}`;
  el.className = 'turn' + (isMe ? ' me' : '');
}

const PIP_MAP = { 1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8] };
function renderDice() {
  const d = state.dice;
  const dice = $('dice');
  dice.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const pip = document.createElement('span');
    pip.className = 'pip' + (d !== null && PIP_MAP[d] && PIP_MAP[d].includes(i) ? '' : ' off');
    dice.appendChild(pip);
  }
  const dn = $('diceNum');
  dn.textContent = d === null ? '–' : d;
  if (d !== null && d !== lastDice) {
    dice.classList.remove('roll'); void dice.offsetWidth; dice.classList.add('roll');
    dn.classList.remove('six'); void dn.offsetWidth; if (d === 6) dn.classList.add('six');
  }
  if (d === null) dn.classList.remove('six');
  lastDice = d;
  const cur = state.players[state.current];
  const isMeTurn = cur && cur.id === myId;
  const canRoll = state.phase === 'playing' && isMeTurn && state.turnStage === 'roll';
  $('btnRoll').disabled = !canRoll;
  $('btnRoll').style.display = canRoll ? '' : 'none';
}

function renderLog() {
  const box = $('logBox');
  box.innerHTML = '';
  (state.log || []).slice().reverse().forEach(t => {
    const div = document.createElement('div');
    div.textContent = t;
    box.appendChild(div);
  });
}

function renderWinner() {
  if (state.phase === 'ended' && state.winner !== null) {
    const w = state.players[state.winner];
    $('winnerName').innerHTML = w ? `${escapeHtml(w.name)}<em> 获胜！</em>` : '游戏结束';
    if ($('winnerBanner').classList.contains('hidden')) confetti();
    $('winnerBanner').classList.remove('hidden');
  } else {
    $('winnerBanner').classList.add('hidden');
  }
}

// ============ 棋盘（静态，仅建一次） ============
const DOCKS = { green:{x:0,y:0}, yellow:{x:512,y:0}, blue:{x:512,y:512}, red:{x:0,y:512} };
const RUNWAYS = {
  green:  { x0:320, y0:192, dx:0,   dy:32 },
  yellow: { x0:448, y0:320, dx:-32, dy:0  },
  blue:   { x0:320, y0:448, dx:0,   dy:-32 },
  red:    { x0:192, y0:320, dx:32,  dy:0  }
};
const SVGNS = 'http://www.w3.org/2000/svg';

function buildStaticBoard() {
  const svg = $('board');
  svg.innerHTML = '';
  const el = (tag, attrs, text) => {
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text !== undefined) n.textContent = text;
    svg.appendChild(n);
    return n;
  };
  const cellCoords = abs => {
    if (abs <= 12) return { x: 128 + abs * 32, y: 128 };
    if (abs <= 25) return { x: 512, y: 128 + (abs - 13) * 32 };
    if (abs <= 38) return { x: 512 - (abs - 26) * 32, y: 512 };
    return { x: 128, y: 512 - (abs - 39) * 32 };
  };
  const absColor = abs => abs <= 12 ? 'green' : abs <= 25 ? 'yellow' : abs <= 38 ? 'blue' : 'red';

  // 中央四色风车
  const pin = [
    { pts:'192,192 320,192 192,320', c:'green'  },
    { pts:'320,192 448,192 448,320', c:'yellow' },
    { pts:'448,320 448,448 320,448', c:'blue'   },
    { pts:'192,320 320,448 192,448', c:'red'    }
  ];
  pin.forEach(p => el('polygon', { points:p.pts, fill:COLORS[p.c].light, stroke:COLORS[p.c].hex, 'stroke-width':2.5 }));

  // 主路格子
  for (let abs = 0; abs < 52; abs++) {
    const { x, y } = cellCoords(abs);
    const color = absColor(abs);
    const c = COLORS[color];
    const isStart = START[color] === abs;
    let mark = null;
    if (SPECIAL.jump[color] === abs) mark = '↗';
    else if (SPECIAL.bomb[color] === abs) mark = '💣';
    else if (SPECIAL.meteor[color] === abs) mark = '⭐';
    el('rect', { x, y, width:32, height:32, fill:isStart?c.hex:c.light, class:'cell', 'stroke-width':isStart?2:1.4 });
    if (isStart) el('text', { x:x+16, y:y+17, class:'cell-text', 'font-size':16, fill:'#fff' }, '✈');
    else if (mark) el('text', { x:x+16, y:y+17, class:'cell-text', 'font-size':mark==='↗'?19:15 }, mark);
  }

  // 终点跑道
  for (const color of ['green','yellow','blue','red']) {
    const r = RUNWAYS[color], c = COLORS[color];
    for (let i = 0; i < 6; i++) {
      el('rect', { x:r.x0+r.dx*i, y:r.y0+r.dy*i, width:32, height:32, fill:c.light, class:'runway' });
      el('text', { x:r.x0+r.dx*i+16, y:r.y0+r.dy*i+17, class:'cell-text', 'font-size':11, fill:c.hex, 'font-weight':700 }, i+1);
    }
  }

  // 停机坪
  for (const color of ['green','yellow','blue','red']) {
    const d = DOCKS[color], c = COLORS[color];
    el('rect', { x:d.x, y:d.y, width:128, height:128, fill:c.light, class:'runway', 'stroke-width':2.5 });
    for (let i = 0; i < 4; i++) {
      el('circle', { cx:d.x+36+(i%2)*56, cy:d.y+88+Math.floor(i/2)*28, r:13, fill:'#fff', stroke:c.hex, 'stroke-width':1.5, 'stroke-dasharray':'3 3', opacity:.7 });
    }
    el('text', { x:d.x+64, y:d.y+32, class:'cell-text', 'font-size':15, fill:c.hex, 'font-weight':900, 'font-family':"'Noto Sans SC',sans-serif" }, `${c.name} 停机坪`);
    el('text', { x:d.x+64, y:d.y+50, class:'cell-text', 'font-size':10, fill:'rgba(26,26,24,.45)' }, '掷 6 起飞');
  }

  // 中央圆盘
  el('circle', { cx:320, cy:320, r:40, fill:'#fff', stroke:'rgba(26,26,24,.5)', 'stroke-width':2 });
  el('text', { x:320, y:314, class:'cell-text', 'font-family':"'Ma Shan Zheng',serif", 'font-size':26, fill:'#EE3A2B' }, '飞行棋');
  el('text', { x:320, y:338, class:'cell-text', 'font-size':8, fill:'rgba(26,26,24,.45)', 'font-family':'var(--mono)' }, 'LUDO');

  // 飞机层（持久）
  const layer = document.createElementNS(SVGNS, 'g');
  layer.setAttribute('id', 'planesLayer');
  layer.addEventListener('click', onPlaneClick);
  svg.appendChild(layer);

  boardReady = true;
}

function planePos(color, pos) {
  if (pos === FINISH) pos = 58;
  if (pos === DOCK) {
    const d = DOCKS[color];
    return { x: d.x + 36, y: d.y + 88 };
  }
  if (pos >= 53 && pos <= 58) {
    const step = pos - 52;
    const r = RUNWAYS[color];
    return { x: r.x0 + r.dx * (step - 1) + 16, y: r.y0 + r.dy * (step - 1) + 16 };
  }
  const G = 32;
  const abs = (START[color] + pos - 1) % 52;
  let x, y;
  if (abs <= 12) { x = 128 + abs * G + 16; y = 144; }
  else if (abs <= 25) { x = 528; y = 128 + (abs - 13) * G + 16; }
  else if (abs <= 38) { x = 512 - (abs - 26) * G + 16; y = 528; }
  else { x = 144; y = 512 - (abs - 39) * G + 16; }
  return { x, y };
}

function ensurePlane(playerId, color, idx) {
  const key = playerId + '_' + idx;
  if (planeEls[key]) return planeEls[key];
  const layer = document.getElementById('planesLayer');
  const g = document.createElementNS(SVGNS, 'g');
  g.setAttribute('class', 'plane');
  g.dataset.plane = idx;
  g.dataset.player = playerId;
  const inner = document.createElementNS(SVGNS, 'g');
  inner.setAttribute('class', 'inner');
  // 大号透明点击区
  const hit = document.createElementNS(SVGNS, 'circle');
  hit.setAttribute('class', 'hit'); hit.setAttribute('cx', 0); hit.setAttribute('cy', 0); hit.setAttribute('r', 20);
  // 选中光环
  const ring = document.createElementNS(SVGNS, 'circle');
  ring.setAttribute('class', 'ring'); ring.setAttribute('cx', 0); ring.setAttribute('cy', 0); ring.setAttribute('r', 15);
  ring.setAttribute('fill', 'none'); ring.setAttribute('stroke', '#EE3A2B'); ring.setAttribute('stroke-width', 3); ring.setAttribute('stroke-dasharray', '4 3');
  // 阴影
  const sh = document.createElementNS(SVGNS, 'circle');
  sh.setAttribute('cx', 2); sh.setAttribute('cy', 3); sh.setAttribute('r', 12); sh.setAttribute('fill', 'rgba(26,26,24,.25)'); sh.setAttribute('pointer-events', 'none');
  // 机身
  const body = document.createElementNS(SVGNS, 'circle');
  body.setAttribute('class', 'body'); body.setAttribute('cx', 0); body.setAttribute('cy', 0); body.setAttribute('r', 12);
  body.setAttribute('fill', color); body.setAttribute('pointer-events', 'none');
  // 图标
  const glyph = document.createElementNS(SVGNS, 'text');
  glyph.setAttribute('class', 'glyph'); glyph.setAttribute('x', 0); glyph.setAttribute('y', 1);
  glyph.setAttribute('text-anchor', 'middle'); glyph.setAttribute('dominant-baseline', 'central');
  glyph.setAttribute('font-size', 12); glyph.setAttribute('fill', '#fff'); glyph.textContent = '✈';
  // 点我提示
  const tap = document.createElementNS(SVGNS, 'text');
  tap.setAttribute('class', 'tap'); tap.setAttribute('x', 0); tap.setAttribute('y', -22);
  tap.setAttribute('text-anchor', 'middle'); tap.setAttribute('font-size', 13); tap.setAttribute('fill', '#EE3A2B'); tap.textContent = '点我';
  inner.appendChild(hit); inner.appendChild(ring); inner.appendChild(sh); inner.appendChild(body); inner.appendChild(glyph);
  g.appendChild(inner); g.appendChild(tap);
  layer.appendChild(g);
  planeEls[key] = g;
  return g;
}

function renderBoardPlanes() {
  const movableSet = new Set(state.movable || []);
  const cur = state.players[state.current];
  const isMeTurn = cur && cur.id === myId;
  state.players.forEach(p => {
    const c = COLORS[p.color];
    p.planes.forEach((pos, idx) => {
      const g = ensurePlane(p.id, c.hex, idx);
      let x, y;
      if (pos === DOCK) {
        const d = DOCKS[p.color];
        x = d.x + 36 + (idx % 2) * 56;
        y = d.y + 88 + Math.floor(idx / 2) * 28;
      } else {
        const pt = planePos(p.color, pos);
        x = pt.x; y = pt.y;
      }
      g.style.transform = `translate(${x}px, ${y}px)`;
      const movable = isMeTurn && p.id === myId && movableSet.has(idx);
      g.classList.toggle('movable', movable);
      if (movable) g.classList.remove('kicked', 'launch');
    });
  });
}

function onPlaneClick(e) {
  const g = e.target.closest && e.target.closest('.plane');
  if (!g) return;
  if (!g.classList.contains('movable')) return;
  send({ type: 'move', plane: Number(g.dataset.plane) });
}

// ============ 特效 ============
function renderFx(fx) {
  if (!fx || fx.seq === lastFxSeq) return;
  lastFxSeq = fx.seq;
  if (fx.kind === 'roll') {
    if (window.__ludoTest) window.__ludoTest.lastFx = fx;
    if (fx.six && !fx.penalty) {
      spawnFloat('⭐ 6 ⭐', diceScreen(), '#F4B400', 26);
      toast('🎲 掷出 6！可起飞 / 再掷一次');
    } else if (fx.penalty) {
      toast('连续三次 6，作废罚停！');
    } else if (isMeCurrent() && (!state.movable || state.movable.length === 0)) {
      toast('本回合无法移动（需掷 6 才能起飞）');
    }
    return;
  }
  if (fx.kind === 'move') {
    if (window.__ludoTest) window.__ludoTest.lastFx = fx;
    const curId = state.players[state.current] && state.players[state.current].id;
    const me = ensurePlane(curId, COLORS[fx.color].hex, fx.plane);
    const pr = me.getBoundingClientRect();
    if (fx.launched) {
      me.classList.add('launch'); setTimeout(() => me.classList.remove('launch'), 600);
      spawnFloat('🛫 起飞！', { x: pr.left + pr.width / 2, y: pr.top + pr.height / 2 }, COLORS[fx.color].hex, 22);
      spawnBurst(pr.left + pr.width / 2, pr.top + pr.height / 2, COLORS[fx.color].hex);
    }
    if (fx.jump) spawnFloat('⚡ 飞跃 4 格！', { x: pr.left + pr.width / 2, y: pr.top + pr.height / 2 }, '#2D6CDF', 20);
    if (fx.bomb) {
      me.classList.add('kicked'); setTimeout(() => me.classList.remove('kicked'), 600);
      spawnFloat('💣 踩到炸弹，回巢！', { x: pr.left + pr.width / 2, y: pr.top + pr.height / 2 }, '#EE3A2B', 20);
      screenFlash();
    }
    (fx.kicked || []).forEach(k => {
      const pid = playerIdByColor(k.color);
      const kg = pid && planeEls[pid + '_' + k.plane];
      if (kg) {
        kg.classList.add('kicked'); setTimeout(() => kg.classList.remove('kicked'), 600);
        const kr = kg.getBoundingClientRect();
        spawnFloat('💥 踢飞！', { x: kr.left + kr.width / 2, y: kr.top + kr.height / 2 }, '#EE3A2B', 22);
        spawnBurst(kr.left + kr.width / 2, kr.top + kr.height / 2, '#EE3A2B');
      }
      screenFlash();
    });
  }
}
function isMeCurrent() { const cur = state.players[state.current]; return cur && cur.id === myId; }
function playerIdByColor(color) { const p = state.players.find(p => p.color === color); return p ? p.id : null; }
function diceScreen() {
  const r = $('dice').getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}
function spawnFloat(text, pt, color, size) {
  if (!pt) return;
  const d = document.createElement('div');
  d.className = 'float'; d.textContent = text;
  d.style.left = pt.x + 'px'; d.style.top = pt.y + 'px';
  d.style.color = color || '#fff'; d.style.fontSize = (size || 20) + 'px';
  $('fxLayer').appendChild(d);
  setTimeout(() => d.remove(), 1200);
}
function spawnBurst(x, y, color) {
  const d = document.createElement('div');
  d.className = 'burst'; d.style.left = x + 'px'; d.style.top = y + 'px';
  d.style.borderColor = color || '#fff';
  $('fxLayer').appendChild(d);
  setTimeout(() => d.remove(), 750);
}
function screenFlash() {
  const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
}

function confetti() {
  const colors = ['#EE3A2B','#F4B400','#2D6CDF','#13A87A','#8A5CD7','#F5821F'];
  for (let i = 0; i < 70; i++) {
    const d = document.createElement('div');
    d.className = 'cf';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.background = colors[Math.floor(Math.random() * colors.length)];
    d.style.animationDuration = (2.2 + Math.random() * 2.2) + 's';
    d.style.animationDelay = (Math.random() * 0.6) + 's';
    document.body.appendChild(d);
    setTimeout(el => el.remove(), 5200, d);
  }
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// ============ 提示 ============
function updateHint() {
  const bar = $('hintBar');
  if (!state || state.phase === 'waiting') { bar.textContent = ''; bar.classList.remove('go'); return; }
  const cur = state.players[state.current];
  const isMe = cur && cur.id === myId;
  if (state.phase === 'ended') { bar.textContent = '游戏结束'; bar.classList.remove('go'); return; }
  if (!isMe) { bar.textContent = `等待 ${cur ? cur.name : ''} 操作…`; bar.classList.remove('go'); return; }
  if (state.turnStage === 'roll') { bar.textContent = '👉 点击「掷骰子」'; bar.classList.add('go'); return; }
  if (state.turnStage === 'choose') {
    if (state.movable && state.movable.length > 0) { bar.textContent = '点击跳动的飞机移动（点我）'; bar.classList.add('go'); return; }
    bar.textContent = '本回合没有可移动的飞机'; bar.classList.remove('go'); return;
  }
  if (state.turnStage === 'wait') { bar.textContent = '本回合无法移动（需掷 6 才能起飞）'; bar.classList.remove('go'); return; }
  bar.textContent = ''; bar.classList.remove('go');
}

function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2400);
}

// ============ 初始化 ============
(function init() {
  const saved = localStorage.getItem('booe_ludo_name');
  if (saved) $('inpName').value = saved;
  window.addEventListener('resize', () => { if (state && state.phase !== 'waiting') {/* 视图自适应，无需重建 */} });
  setInterval(updateHint, 400);
  // 测试钩子
  window.__ludoTest = { get state(){ return state; }, get lastFxSeq(){ return lastFxSeq; }, planeCount: () => Object.keys(planeEls).length };
  // ?demo=1 单机演示（不连服务器）：本地模拟一局，便于截图/自测点击
  if (location.search.indexOf('demo=1') > -1) {
    enterDemo();
  }
})();

// ============ 单机演示引擎（单人试玩：三个自动对手陪练） ============
function enterDemo() {
  const nm = ($('inpName') && $('inpName').value.trim()) || '止一';
  state = {
    roomId: '4321', phase: 'playing', current: 0, dice: null, turnStage: 'roll',
    players: [
      { id: 'p1', name: nm,        color: 'red',    connected: true, planes: [0, 0, 6, 12] },
      { id: 'p2', name: '阿星', color: 'yellow', connected: true, planes: [0, 19, 0, 0] },
      { id: 'p3', name: '老周', color: 'blue',   connected: true, planes: [33, 33, 7, 0] },
      { id: 'p4', name: '小美', color: 'green',  connected: true, planes: [45, 52, 58, 59] }
    ],
    movable: [], fx: null, winner: null,
    log: ['单人试玩：点击掷骰子，再点跳动的飞机移动']
  };
  myId = 'p1';
  boardReady = false;
  for (const k in planeEls) delete planeEls[k];
  window.send = demoSend;
  render();
}
function demoSend(obj) {
  if (obj.type === 'roll') demoRoll();
  else if (obj.type === 'move') demoMove(obj.plane);
  else if (obj.type === 'restart') enterDemo();
  else if (obj.type === 'start') render();
}
function demoMovable(p, dice) {
  const list = [];
  for (let i = 0; i < 4; i++) {
    const pos = p.planes[i];
    if (pos === FINISH) continue;
    if (pos === DOCK) { if (dice === 6) list.push(i); }
    else list.push(i);
  }
  return list;
}
function demoRoll() {
  const cur = state.players[state.current];
  const dice = Math.floor(Math.random() * 6) + 1;
  state.dice = dice;
  state.movable = demoMovable(cur, dice);
  state.turnStage = state.movable.length ? 'choose' : 'wait';
  state.fx = { kind: 'roll', dice, six: dice === 6, seq: ++demoSeq };
  render();
  if (state.turnStage === 'wait') setTimeout(demoNext, 1300);
}
function demoMove(plane) {
  const cur = state.players[state.current];
  const from = cur.planes[plane];
  let pos = from;
  const wasDock = pos === DOCK;
  if (wasDock) pos = 1 + (state.dice - 1);
  else pos += state.dice;
  if (pos > FINISH) pos = FINISH - (pos - FINISH);
  let bounced = false, jumped = false;
  if (pos >= 1 && pos <= TRACK_MAX) {
    const abs = (START[cur.color] + pos - 1) % 52;
    if (SPECIAL.jump[cur.color] === abs || SPECIAL.meteor[cur.color] === abs) { pos += 4; jumped = true; }
    else if (SPECIAL.bomb[cur.color] === abs) { pos = DOCK; bounced = true; }
  }
  cur.planes[plane] = pos;
  // 踩踏判定（与服务器同规则：主路同格踢回停机坪）
  const kicked = [];
  if (!bounced && pos >= 1 && pos <= TRACK_MAX) {
    const abs = (START[cur.color] + pos - 1) % 52;
    for (const other of state.players) {
      if (other === cur) continue;
      for (let j = 0; j < 4; j++) {
        const op = other.planes[j];
        if (op >= 1 && op <= TRACK_MAX && (START[other.color] + op - 1) % 52 === abs) {
          other.planes[j] = DOCK; kicked.push({ color: other.color, plane: j });
        }
      }
    }
  }
  state.fx = { kind: 'move', color: cur.color, plane, from, to: pos, launched: wasDock, bomb: bounced, jump: jumped, kicked, seq: ++demoSeq };
  render();
  // 胜利判定
  if (cur.planes.every(p => p === FINISH)) {
    state.phase = 'ended'; state.winner = state.current; render(); return;
  }
  setTimeout(demoNext, 900);
}
function demoNext() {
  state.dice = null; state.turnStage = 'roll'; state.movable = []; state.fx = null;
  if (state.phase !== 'playing') return;
  do {
    state.current = (state.current + 1) % state.players.length;
  } while (state.players[state.current].planes.every(p => p === FINISH));
  render();
  if (state.current !== 0) setTimeout(demoAutoPlay, 800);
}
function demoAutoPlay() {
  if (state.current === 0) return; // 回到我，停手
  demoRoll();
  if (state.turnStage === 'choose') {
    setTimeout(() => {
      const m = state.movable[0];
      if (m != null) demoMove(m); else demoNext();
    }, 700);
  }
  // wait 分支由 demoRoll 内的 setTimeout(demoNext) 处理
}
</script>
