<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>飞行棋 · 一起玩</title>
<meta name="theme-color" content="#EE3A2B">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fonts/mashanzheng.css">
<style>
  :root{
    --paper:#FAF4E6; --ink:#1A1A18; --red:#EE3A2B; --ink-mid:#6A6A60;
    --c4:#F4B400; --c2:#2D6CDF; --c3:#13A87A; --c5:#8A5CD7;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--paper);color:var(--ink);font-family:'Noto Sans SC',sans-serif;
    min-height:100vh;padding:14px 12px 80px;position:relative;}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(rgba(26,26,24,.04) 1px,transparent 1px);background-size:3px 3px;}
  .back{position:fixed;top:12px;left:12px;z-index:10;color:var(--ink);text-decoration:none;
    font-size:12px;font-weight:900;letter-spacing:.2em;padding:7px 13px;
    border:2px solid var(--ink);background:var(--paper);}
  .back:hover{background:var(--ink);color:var(--paper);}

  .head{text-align:center;margin:42px 0 6px;position:relative;}
  .head .badge{display:inline-block;background:var(--ink);color:var(--paper);font-weight:900;font-size:10px;
    letter-spacing:.28em;padding:5px 12px;transform:rotate(-3deg);}
  .head h1{font-family:'Ma Shan Zheng',serif;font-weight:400;font-size:48px;line-height:1.1;margin:10px 0 2px;color:var(--red);}
  .head .sub{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--ink-mid);}
  .head .star{position:absolute;font-size:20px;}
  .head .s1{top:4px;left:18%;color:var(--c4);transform:rotate(-14deg);}
  .head .s2{top:34px;right:16%;color:var(--c2);font-size:15px;}
  .head .s3{bottom:0;left:26%;color:var(--c3);font-size:13px;}

  /* ===== 加入 / 等待 ===== */
  .box{max-width:400px;margin:22px auto;text-align:center;}
  .box .field{border:3px solid var(--ink);background:#fff;padding:13px 16px;font-size:15px;
    font-family:inherit;width:100%;margin-bottom:12px;color:var(--ink);outline:none;font-weight:700;}
  .box .field:focus{border-color:var(--red);}
  .box .row{display:flex;gap:10px;}
  .box .row .field{flex:1;}
  .btn{border:2px solid var(--ink);background:#fff;color:var(--ink);padding:13px 22px;font-size:14px;
    font-weight:900;letter-spacing:.2em;cursor:pointer;font-family:inherit;transition:all .15s;}
  .btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink);}
  .btn.primary{background:var(--red);border-color:var(--red);color:#fff;}
  .btn:disabled{opacity:.4;cursor:wait;transform:none;box-shadow:none;}
  .room-num{font-family:var(--mono);font-size:56px;font-weight:900;letter-spacing:.15em;
    border:3px solid var(--ink);padding:14px;margin:10px 0 6px;background:#fff;
    box-shadow:6px 6px 0 rgba(238,58,43,.25);color:var(--red);}
  .room-hint{font-size:12px;color:var(--ink-mid);letter-spacing:.2em;margin-bottom:20px;}
  .player-list{margin:14px 0 22px;}
  .player-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border:2px solid var(--ink);
    margin-bottom:8px;font-size:14px;font-weight:700;background:#fff;}
  .player-row .dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:2px solid rgba(26,26,24,.35);}
  .player-row .status{margin-left:auto;font-size:11px;color:var(--ink-mid);font-weight:400;}
  .tag-host{font-size:10px;background:var(--red);color:#fff;padding:2px 7px;margin-left:6px;}

  /* ===== 游戏界面 ===== */
  .game-box{max-width:560px;margin:0 auto;}
  .roster{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .chip{display:flex;align-items:center;gap:6px;border:2px solid var(--ink);background:#fff;
    padding:5px 10px;font-size:12px;font-weight:900;}
  .chip .dot{width:11px;height:11px;border-radius:50%;border:2px solid rgba(26,26,24,.3);}
  .chip.cur{background:var(--ink);color:var(--paper);}
  .chip .fin{font-family:var(--mono);font-size:10px;color:var(--ink-mid);}
  .chip.cur .fin{color:var(--c4);}
  .status-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;}
  .status-bar .turn{font-weight:900;padding:7px 14px;border:2px solid var(--ink);background:#fff;}
  .status-bar .turn.me{background:var(--red);color:#fff;border-color:var(--red);
    box-shadow:3px 3px 0 rgba(26,26,24,.25);}

  .dice{width:48px;height:48px;border:2.5px solid var(--ink);background:#fff;
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    padding:6px;box-shadow:3px 3px 0 rgba(26,26,24,.25);}
  .dice .pip{width:8px;height:8px;border-radius:50%;background:var(--red);
    align-self:center;justify-self:center;}
  .dice .pip.off{visibility:hidden;}
  .dice.roll{animation:diceShake .38s ease-in-out 2;}
  @keyframes diceShake{
    0%,100%{transform:rotate(0);}
    25%{transform:rotate(-14deg) scale(1.12);}
    75%{transform:rotate(14deg) scale(.94);}
  }

  #board{width:100%;display:block;background:var(--paper);border:3px solid var(--ink);
    box-shadow:7px 7px 0 rgba(26,26,24,.16);}

  .action-bar{margin-top:14px;text-align:center;}
  .action-bar .btn{font-size:16px;padding:15px 36px;}
  .hint-bar{margin-top:9px;text-align:center;font-size:13px;color:var(--ink-mid);min-height:20px;}
  .log-box{margin-top:14px;border:2px solid var(--ink);padding:10px 12px;max-height:130px;overflow-y:auto;
    font-size:12px;line-height:1.9;color:var(--ink-mid);background:#fff;}
  .log-box div:first-child{color:var(--ink);font-weight:700;}

  /* 棋盘 SVG */
  .cell{stroke:rgba(26,26,24,.4);stroke-width:1.4;}
  .cell-text{text-anchor:middle;dominant-baseline:central;pointer-events:none;}
  .runway{stroke:rgba(26,26,24,.4);stroke-width:1.4;}
  .plane{pointer-events:all;cursor:default;}
  .plane.movable{cursor:pointer;animation:planeBob 0.9s ease-in-out infinite;}
  @keyframes planeBob{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-5px);}
  }
  .winner-banner{position:fixed;inset:0;z-index:50;background:rgba(26,26,24,.78);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--paper);}
  .winner-banner .w-title{font-family:'Ma Shan Zheng',serif;font-size:clamp(40px,10vw,80px);}
  .winner-banner .w-title em{font-style:normal;color:var(--c4);}
  .winner-banner .w-sub{font-size:13px;letter-spacing:.3em;color:rgba(250,244,230,.75);margin:12px 0 30px;}
  .winner-banner .btn{color:var(--paper);border-color:var(--paper);background:transparent;}
  .winner-banner .btn:hover{background:var(--paper);color:var(--ink);box-shadow:none;}
  .winner-banner .btn.primary{background:var(--red);border-color:var(--red);}

  .cf{position:fixed;top:-16px;width:9px;height:14px;z-index:60;pointer-events:none;animation:cfFall linear forwards;}
  @keyframes cfFall{0%{transform:translateY(0) rotate(0);}100%{transform:translateY(105vh) rotate(720deg);}}

  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;
    padding:10px 22px;font-size:13px;font-weight:700;letter-spacing:.1em;z-index:70;
    opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:4px 4px 0 rgba(26,26,24,.3);}
  .toast.show{opacity:1;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<a class="back" href="index.html#play">← 回基地</a>

<!-- ===== 加入界面 ===== -->
<div id="joinView">
  <div class="head">
    <span class="star s1">✦</span><span class="star s2">✶</span><span class="star s3">❉</span>
    <div class="badge">多 人 实 时</div>
    <h1>飞行棋</h1>
    <div class="sub">LUDO · 2-4 人 · 掷骰起飞 · 踩人回巢</div>
  </div>
  <div class="box">
    <input class="field" id="inpName" placeholder="你的名字" maxlength="12">
    <div class="row">
      <input class="field" id="inpRoom" placeholder="房间号(4位)" maxlength="4" inputmode="numeric">
      <button class="btn primary" id="btnJoin" onclick="joinRoom()">加入</button>
    </div>
    <div style="margin:16px 0;font-size:11px;color:var(--ink-mid);letter-spacing:.2em;">— 或 —</div>
    <button class="btn" id="btnCreate" onclick="createRoom()">创建房间</button>
  </div>
</div>

<!-- ===== 等待界面 ===== -->
<div id="waitView" class="hidden">
  <div class="box">
    <div class="room-num" id="roomNum">----</div>
    <div class="room-hint">把房间号发给朋友，他们就能加入</div>
    <div class="player-list" id="waitPlayers"></div>
    <button class="btn primary" id="btnStart" onclick="send({type:'start'})">开始游戏</button>
    <div style="margin-top:10px;font-size:11px;color:var(--ink-mid);">至少 2 人才能开始</div>
  </div>
</div>

<!-- ===== 游戏界面 ===== -->
<div id="gameView" class="hidden">
  <div class="head" style="margin-top:46px;">
    <h1 style="font-size:30px;">飞行棋</h1>
    <div class="sub">房间 <span id="roomNum2" style="color:var(--red);font-weight:700;">----</span></div>
  </div>
  <div class="game-box">
    <div class="roster" id="roster"></div>
    <div class="status-bar">
      <span class="turn" id="turnLabel">等待…</span>
      <div class="dice" id="dice"></div>
    </div>
    <svg id="board" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="action-bar">
      <button class="btn primary" id="btnRoll" onclick="send({type:'roll'})">掷骰子</button>
    </div>
    <div class="hint-bar" id="hintBar"></div>
    <div class="log-box" id="logBox"></div>
  </div>
</div>

<!-- 胜利横幅 -->
<div id="winnerBanner" class="winner-banner hidden">
  <div class="w-title" id="winnerName"></div>
  <div class="w-sub">四机全部到达 · 本局获胜</div>
  <button class="btn primary" onclick="send({type:'restart'})">再来一局</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ 常量 ============
const COLORS = {
  red:    { name: '红', hex: '#EE3A2B', light: '#FBDFDB' },
  yellow: { name: '黄', hex: '#F4B400', light: '#FCEEC9' },
  blue:   { name: '蓝', hex: '#2D6CDF', light: '#DCE6FA' },
  green:  { name: '绿', hex: '#13A87A', light: '#D2EFE3' }
};
const START = { red: 39, yellow: 13, blue: 26, green: 0 };
const SPECIAL = {
  jump:  { green: 5,  yellow: 18, blue: 31, red: 44 },
  bomb:  { green: 8,  yellow: 21, blue: 34, red: 47 },
  meteor:{ green: 11, yellow: 24, blue: 37, red: 50 }
};
const DOCK = 0, TRACK_MAX = 52, FINISH = 59;

// ============ 状态 ============
let ws = null, roomId = null, myId = null, myColor = null, state = null, reconnTimer = null;
let lastDice = null;
const $ = id => document.getElementById(id);

// ============ 创建/加入 ============
async function createRoom() {
  const name = $('inpName').value.trim();
  if (!name) { toast('先填名字'); return; }
  localStorage.setItem('booe_ludo_name', name);
  $('btnCreate').disabled = true;
  try {
    const res = await fetch('/api/ludo/create', { method: 'POST' });
    const data = await res.json();
    if (!data.ok) { toast(data.error || '创建失败'); return; }
    roomId = data.roomId;
    connect();
  } catch (e) { toast('网络错误'); }
  finally { $('btnCreate').disabled = false; }
}

function joinRoom() {
  const name = $('inpName').value.trim();
  const rid = $('inpRoom').value.trim();
  if (!name) { toast('先填名字'); return; }
  if (!/^\d{4}$/.test(rid)) { toast('房间号是 4 位数字'); return; }
  localStorage.setItem('booe_ludo_name', name);
  roomId = rid;
  connect();
}

function connect() {
  const name = localStorage.getItem('booe_ludo_name') || '玩家';
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/ludo/${roomId}`);
  ws.onopen = () => { ws.send(JSON.stringify({ type: 'join', name })); };
  ws.onmessage = (e) => { handleMsg(JSON.parse(e.data)); };
  ws.onclose = () => {
    if (state && state.phase === 'playing') { toast('连接断开，正在重连…'); scheduleReconnect(); }
  };
  ws.onerror = () => {};
}
function scheduleReconnect() {
  clearTimeout(reconnTimer);
  reconnTimer = setTimeout(() => { try { connect(); } catch (e) {} }, 2000);
}
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

// ============ 消息处理 ============
function handleMsg(msg) {
  switch (msg.type) {
    case 'joined': myId = msg.playerId; myColor = msg.color; break;
    case 'state': state = msg; render(); break;
    case 'error': toast(msg.msg); break;
  }
}

// ============ 渲染 ============
function render() {
  if (!state) return;
  if (state.phase === 'waiting') {
    $('joinView').classList.add('hidden');
    $('gameView').classList.add('hidden');
    $('waitView').classList.remove('hidden');
    renderWaiting();
  } else {
    $('joinView').classList.add('hidden');
    $('waitView').classList.add('hidden');
    $('gameView').classList.remove('hidden');
    renderGame();
  }
}

function renderWaiting() {
  $('roomNum').textContent = state.roomId;
  const list = $('waitPlayers');
  list.innerHTML = '';
  state.players.forEach((p, i) => {
    const c = COLORS[p.color];
    const row = document.createElement('div');
    row.className = 'player-row';
    row.innerHTML = `
      <span class="dot" style="background:${c.hex}"></span>
      <span>${escapeHtml(p.name)}</span>
      ${i === 0 ? '<span class="tag-host">房主</span>' : ''}
      ${p.id === myId ? '<span style="margin-left:4px;font-size:10px;color:var(--red)">(你)</span>' : ''}
      <span class="status">${p.connected ? '在线' : '掉线'}</span>`;
    list.appendChild(row);
  });
  const isHost = state.players[0] && state.players[0].id === myId;
  $('btnStart').style.display = isHost ? '' : 'none';
}

function renderGame() {
  $('roomNum2').textContent = state.roomId;
  renderRoster();
  renderTurn();
  renderDice();
  renderBoard();
  renderLog();
  renderWinner();
}

// 玩家状态条
function renderRoster() {
  const box = $('roster');
  box.innerHTML = '';
  state.players.forEach((p, i) => {
    const c = COLORS[p.color];
    const fin = p.planes.filter(pos => pos === FINISH).length;
    const chip = document.createElement('span');
    chip.className = 'chip' + (i === state.current && state.phase === 'playing' ? ' cur' : '');
    chip.innerHTML = `<span class="dot" style="background:${c.hex}"></span>` +
      `${escapeHtml(p.name)}<span class="fin">🏁${fin}</span>`;
    box.appendChild(chip);
  });
}

function renderTurn() {
  const cur = state.players[state.current];
  const el = $('turnLabel');
  if (!cur) { el.textContent = '等待…'; return; }
  const isMe = cur.id === myId;
  el.textContent = isMe ? '轮到你' : `轮到 ${cur.name}`;
  el.className = 'turn' + (isMe ? ' me' : '');
}

// 点数骰
const PIP_MAP = { 1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8] };
function renderDice() {
  const d = state.dice;
  const dice = $('dice');
  dice.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const pip = document.createElement('span');
    pip.className = 'pip' + (d !== null && PIP_MAP[d] && PIP_MAP[d].includes(i) ? '' : ' off');
    dice.appendChild(pip);
  }
  if (d !== null && d !== lastDice) {
    dice.classList.remove('roll');
    void dice.offsetWidth;
    dice.classList.add('roll');
  }
  lastDice = d;
  const cur = state.players[state.current];
  const isMeTurn = cur && cur.id === myId;
  const canRoll = state.phase === 'playing' && isMeTurn && state.turnStage === 'roll';
  $('btnRoll').disabled = !canRoll;
  $('btnRoll').style.display = canRoll ? '' : 'none';
}

function renderLog() {
  const box = $('logBox');
  box.innerHTML = '';
  (state.log || []).slice().reverse().forEach(t => {
    const div = document.createElement('div');
    div.textContent = t;
    box.appendChild(div);
  });
}

function renderWinner() {
  if (state.phase === 'ended' && state.winner !== null) {
    const w = state.players[state.winner];
    $('winnerName').innerHTML = w ? `${escapeHtml(w.name)}<em> 获胜！</em>` : '游戏结束';
    if ($('winnerBanner').classList.contains('hidden')) confetti();
    $('winnerBanner').classList.remove('hidden');
  } else {
    $('winnerBanner').classList.add('hidden');
  }
}

function confetti() {
  const colors = ['#EE3A2B','#F4B400','#2D6CDF','#13A87A','#8A5CD7','#F5821F'];
  for (let i = 0; i < 70; i++) {
    const d = document.createElement('div');
    d.className = 'cf';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.background = colors[Math.floor(Math.random() * colors.length)];
    d.style.animationDuration = (2.2 + Math.random() * 2.2) + 's';
    d.style.animationDelay = (Math.random() * 0.6) + 's';
    document.body.appendChild(d);
    setTimeout(el => el.remove(), 5200, d);
  }
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// ============ 棋盘 ============
const DOCKS = {
  green:  { x: 0,   y: 0 },
  yellow: { x: 512, y: 0 },
  blue:   { x: 512, y: 512 },
  red:    { x: 0,   y: 512 }
};
const RUNWAYS = {
  green:  { x0: 320, y0: 192, dx: 0,   dy: 32 },
  yellow: { x0: 448, y0: 320, dx: -32, dy: 0 },
  blue:   { x0: 320, y0: 448, dx: 0,   dy: -32 },
  red:    { x0: 192, y0: 320, dx: 32,  dy: 0 }
};

function buildBoardSVG() {
  const svg = $('board');
  svg.innerHTML = '';
  const NS = 'http://www.w3.org/2000/svg';
  const G = 32;
  const el = (tag, attrs, text) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text !== undefined) n.textContent = text;
    svg.appendChild(n);
    return n;
  };
  const cellCoords = abs => {
    if (abs <= 12) return { x: 128 + abs * G, y: 128 };
    if (abs <= 25) return { x: 512, y: 128 + (abs - 13) * G };
    if (abs <= 38) return { x: 512 - (abs - 26) * G, y: 512 };
    return { x: 128, y: 512 - (abs - 39) * G };
  };
  const absColor = abs => abs <= 12 ? 'green' : abs <= 25 ? 'yellow' : abs <= 38 ? 'blue' : 'red';

  // 中央四色风车（先画，被跑道与中心压住）
  const pin = [
    { pts: '192,192 320,192 192,320', c: 'green'  },
    { pts: '320,192 448,192 448,320', c: 'yellow' },
    { pts: '448,320 448,448 320,448', c: 'blue'   },
    { pts: '192,320 320,448 192,448', c: 'red'    }
  ];
  pin.forEach(p => el('polygon', { points: p.pts, fill: COLORS[p.c].light, stroke: COLORS[p.c].hex, 'stroke-width': 2.5 }));

  // 主路格子
  for (let abs = 0; abs < 52; abs++) {
    const { x, y } = cellCoords(abs);
    const color = absColor(abs);
    const c = COLORS[color];
    let mark = null;
    let isStart = START[color] === abs;
    if (SPECIAL.jump[color] === abs) mark = '↗';
    else if (SPECIAL.bomb[color] === abs) mark = '💣';
    else if (SPECIAL.meteor[color] === abs) mark = '⭐';
    el('rect', {
      x, y, width: G, height: G,
      fill: isStart ? c.hex : c.light,
      class: 'cell', 'stroke-width': isStart ? 2 : 1.4
    });
    if (isStart) {
      el('text', { x: x + G/2, y: y + G/2 + 1, class: 'cell-text', 'font-size': 16, fill: '#fff' }, '✈');
    } else if (mark) {
      el('text', { x: x + G/2, y: y + G/2 + 1, class: 'cell-text', 'font-size': mark === '↗' ? 19 : 15 }, mark);
    }
  }

  // 终点跑道
  for (const color of ['green', 'yellow', 'blue', 'red']) {
    const r = RUNWAYS[color], c = COLORS[color];
    for (let i = 0; i < 6; i++) {
      el('rect', { x: r.x0 + r.dx * i, y: r.y0 + r.dy * i, width: G, height: G, fill: c.light, class: 'runway' });
      el('text', { x: r.x0 + r.dx * i + G/2, y: r.y0 + r.dy * i + G/2 + 1, class: 'cell-text', 'font-size': 11, fill: c.hex, 'font-weight': 700 }, i + 1);
    }
  }

  // 停机坪（四角）
  for (const color of ['green', 'yellow', 'blue', 'red']) {
    const d = DOCKS[color], c = COLORS[color];
    el('rect', { x: d.x, y: d.y, width: 128, height: 128, fill: c.light, class: 'runway', 'stroke-width': 2.5 });
    // 4 个虚线机位
    for (let i = 0; i < 4; i++) {
      el('circle', {
        cx: d.x + 36 + (i % 2) * 56, cy: d.y + 88 + Math.floor(i / 2) * 28,
        r: 13, fill: '#fff', stroke: c.hex, 'stroke-width': 1.5, 'stroke-dasharray': '3 3', opacity: .7
      });
    }
    el('text', { x: d.x + 64, y: d.y + 32, class: 'cell-text', 'font-size': 15, fill: c.hex, 'font-weight': 900,
      'font-family': "'Noto Sans SC',sans-serif" }, `${c.name} 停机坪`);
    el('text', { x: d.x + 64, y: d.y + 50, class: 'cell-text', 'font-size': 10, fill: 'rgba(26,26,24,.45)' }, '掷 6 起飞');
  }

  // 中央圆盘 + 刊字
  el('circle', { cx: 320, cy: 320, r: 40, fill: '#fff', stroke: 'rgba(26,26,24,.5)', 'stroke-width': 2 });
  el('text', { x: 320, y: 314, class: 'cell-text', 'font-family': "'Ma Shan Zheng',serif", 'font-size': 26, fill: '#EE3A2B' }, '飞行棋');
  el('text', { x: 320, y: 338, class: 'cell-text', 'font-size': 8, fill: 'rgba(26,26,24,.45)', 'font-family': 'var(--mono)' }, 'LUDO');
}

function planePos(color, pos) {
  if (pos === DOCK) {
    const d = DOCKS[color];
    return { x: d.x + 36, y: d.y + 88 };
  }
  if (pos >= 53 && pos <= 58) {
    const step = pos - 52;
    const r = RUNWAYS[color];
    return { x: r.x0 + r.dx * (step - 1) + 16, y: r.y0 + r.dy * (step - 1) + 16 };
  }
  const G = 32;
  const abs = (START[color] + pos - 1) % 52;
  let x, y;
  if (abs <= 12) { x = 128 + abs * G + 16; y = 144; }
  else if (abs <= 25) { x = 528; y = 128 + (abs - 13) * G + 16; }
  else if (abs <= 38) { x = 512 - (abs - 26) * G + 16; y = 528; }
  else { x = 144; y = 512 - (abs - 39) * G + 16; }
  return { x, y };
}

function renderBoard() {
  buildBoardSVG();
  const svg = $('board');
  const NS = 'http://www.w3.org/2000/svg';
  const movableSet = new Set(state.movable || []);

  state.players.forEach(p => {
    const c = COLORS[p.color];
    p.planes.forEach((pos, planeIdx) => {
      let x, y;
      if (pos === DOCK) {
        const d = DOCKS[p.color];
        x = d.x + 36 + (planeIdx % 2) * 56;
        y = d.y + 88 + Math.floor(planeIdx / 2) * 28;
      } else {
        const pt = planePos(p.color, pos);
        x = pt.x; y = pt.y;
      }
      const isMe = p.id === myId;
      const movable = isMe && movableSet.has(planeIdx);
      drawPlane(svg, NS, x, y, c.hex, planeIdx, movable);
    });
  });
}

function drawPlane(svg, NS, x, y, color, idx, movable) {
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'plane' + (movable ? ' movable' : ''));
  if (movable) {
    g.addEventListener('click', () => send({ type: 'move', plane: idx }));
    // 选中光环
    const halo = document.createElementNS(NS, 'circle');
    halo.setAttribute('cx', x); halo.setAttribute('cy', y);
    halo.setAttribute('r', 15);
    halo.setAttribute('fill', 'none');
    halo.setAttribute('stroke', '#EE3A2B');
    halo.setAttribute('stroke-width', 2);
    halo.setAttribute('stroke-dasharray', '4 3');
    g.appendChild(halo);
  }
  // 硬阴影
  const shadow = document.createElementNS(NS, 'circle');
  shadow.setAttribute('cx', x + 2); shadow.setAttribute('cy', y + 3);
  shadow.setAttribute('r', 11);
  shadow.setAttribute('fill', 'rgba(26,26,24,.25)');
  g.appendChild(shadow);
  // 机身
  const circle = document.createElementNS(NS, 'circle');
  circle.setAttribute('cx', x); circle.setAttribute('cy', y);
  circle.setAttribute('r', 11);
  circle.setAttribute('fill', color);
  circle.setAttribute('stroke', '#fff');
  circle.setAttribute('stroke-width', 2);
  g.appendChild(circle);
  // ✈ 图标
  const glyph = document.createElementNS(NS, 'text');
  glyph.setAttribute('x', x); glyph.setAttribute('y', y + 1);
  glyph.setAttribute('class', 'cell-text');
  glyph.setAttribute('font-size', 11);
  glyph.setAttribute('fill', '#fff');
  glyph.textContent = '✈';
  g.appendChild(glyph);
  svg.appendChild(g);
}

// ============ 提示 ============
function updateHint() {
  const bar = $('hintBar');
  if (!state || state.phase === 'waiting') { bar.textContent = ''; return; }
  const cur = state.players[state.current];
  const isMe = cur && cur.id === myId;
  if (state.phase === 'ended') { bar.textContent = '游戏结束'; return; }
  if (!isMe) { bar.textContent = `等待 ${cur.name} 操作…`; return; }
  if (state.turnStage === 'roll') { bar.textContent = '点击「掷骰子」'; return; }
  if (state.movable && state.movable.length > 0) { bar.textContent = '点击一架跳动的飞机移动'; return; }
  bar.textContent = '';
}

function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2200);
}

// ============ 初始化 ============
(function init() {
  const saved = localStorage.getItem('booe_ludo_name');
  if (saved) $('inpName').value = saved;
  window.addEventListener('resize', () => { if (state && state.phase !== 'waiting') renderBoard(); });
  setInterval(updateHint, 500);
  // ?demo=1 模拟一盘中盘局面（不连服务器，供截图/演示）
  if (location.search.indexOf('demo=1') > -1) {
    state = { roomId: '4321', phase: 'playing', current: 0, dice: 5, turnStage: 'move',
      players: [
        { id: 'p1', name: '止一', color: 'red',    connected: true, planes: [5, 12, 0, 0] },
        { id: 'p2', name: '阿星', color: 'yellow', connected: true, planes: [19, 0, 0, 0] },
        { id: 'p3', name: '老周', color: 'blue',   connected: true, planes: [33, 33, 7, 0] },
        { id: 'p4', name: '小美', color: 'green',  connected: true, planes: [45, 52, 58, 59] }
      ],
      movable: [0, 1],
      log: ['演示：小美的飞机率先到达终点', '演示：轮到 止一 掷出 5 点', '演示：阿星踩中炸弹回巢'] };
    myId = 'p1';
    render();
  }
})();
</script>
