<script>
const {records,coverage,stamp}=JSON.parse(document.querySelector('#data').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=url=>/^https?:\/\//i.test(url)?esc(url):'';
const related=records.filter(x=>x.related).length, reviewed=records.filter(x=>x.reviewed).length;
$('stamp').textContent='更新 '+stamp+' 北京时间';
$('numbers').innerHTML=[[coverage.length,'家核验公司'],[records.length,'条已读记录'],[related,'条方向相关'],[reviewed,'条重点复核']].map(([n,t])=>'<div><b>'+n+'</b><span>'+t+'</span></div>').join('');
const pct=records.length?Math.round(related*100/records.length):0;
$('ring').style.setProperty('--p',pct+'%');$('ring').setAttribute('aria-label','方向相关占比 '+pct+'%');$('ring').innerHTML='<span>'+pct+'%</span>';
$('ratio').textContent=related+' / '+records.length+' 条已读记录';
const chartCompanies=coverage.filter(x=>x.related).sort((a,b)=>b.related-a.related).slice(0,6);
$('chart').innerHTML=chartCompanies.map(x=>'<div class="mini"><span>'+esc(x.company)+'</span><div class="track"><div class="fill" style="width:'+100*x.related/chartCompanies[0].related+'%"></div></div><b>'+x.related+'</b></div>').join('');
$('cover').innerHTML=coverage.slice().sort((a,b)=>b.total-a.total).map(x=>'<div><b>'+esc(x.company)+' · '+(x.total?x.total+' 条':'待核实')+'</b><small>'+esc(x.status)+'</small><small>'+esc(x.scope)+'</small></div>').join('');
let page=0; const pageSize=20;
function updateCompanies(matches,selected){
 const counts=new Map();
 for(const job of matches) counts.set(job.company,(counts.get(job.company)||0)+1);
 const companies=coverage.map(x=>({...x,count:counts.get(x.company)||0})).sort((a,b)=>b.count-a.count||Number(!a.total)-Number(!b.total)||a.company.localeCompare(b.company,'zh'));
 const all=new Option('全部公司 · '+matches.length,'');
 const options=companies.map(x=>{
   const option=new Option(x.company+' · '+x.count+(x.total?'':'（覆盖待核验）'),x.company);
   option.disabled=x.count===0&&x.company!==selected;
   return option;
 });
 $('company').replaceChildren(all,...options);
 $('company').value=selected;
}
function metric(label,n,fit){return '<div class="metric"><span>'+label+'</span><strong>'+(n??'—')+'</strong>'+(n==null?'':'<div class="track" role="progressbar" aria-label="'+label+'" aria-valuenow="'+n+'" aria-valuemin="0" aria-valuemax="100"><div class="fill '+(fit?'fit':'')+'" style="width:'+n+'%"></div></div>')+'</div>'}
function render(){
 const q=$('search').value.trim().toLowerCase(), company=$('company').value, scope=$('scope').value, order=$('order').value, second=order==='a'?'b':'a';
 const matches=records.filter(x=>(scope==='all'||(scope==='related'?x.related:x.reviewed))&&(!q||[x.title,x.company,x.city,x.desc,x.req].filter(Boolean).join(' ').toLowerCase().includes(q)));
 updateCompanies(matches,company);
 const rows=matches.filter(x=>!company||x.company===company).sort((x,y)=>(y[order]??-1)-(x[order]??-1)||(y[second]??-1)-(x[second]??-1)||y.reviewed-x.reviewed);
 const pages=Math.max(1,Math.ceil(rows.length/pageSize));page=Math.min(page,pages-1);
 $('result').textContent=rows.length+' 条结果'; $('page').textContent=(page+1)+' / '+pages;
 $('prev').disabled=page===0;$('next').disabled=page>=pages-1;
 $('jobs').innerHTML=rows.slice(page*pageSize,(page+1)*pageSize).map(x=>{const url=safe(x.url);return '<article class="job"><div class="identity"><div class="muted">'+esc(x.company)+(x.city?' · '+esc(x.city):'')+' '+(x.reviewed?'<span class="badge">重点复核</span>':'')+'</div><h3>'+(url?'<a href="'+url+'" target="_blank" rel="noopener">'+esc(x.title)+' ↗</a>':esc(x.title))+'</h3><div class="muted">语言 '+esc(x.language)+'</div>'+(x.note?'<p class="note">'+esc(x.note)+'</p>':'')+'</div>'+metric('意愿度',x.a,false)+metric('履历匹配度',x.b,true)+(x.desc||x.req?'<details><summary>展开职位要求</summary><p>'+esc(x.desc)+(x.req?'\n\n'+esc(x.req):'')+'</p></details>':'')+'</article>'}).join('')||'<p>没有匹配结果。可以缩短关键词或切换到全部记录。</p>';
}
for(const id of ['search','company','scope','order']) $(id).addEventListener(id==='search'?'input':'change',()=>{page=0;render()});
$('prev').onclick=()=>{page--;render();$('result').scrollIntoView({block:'center'})};$('next').onclick=()=>{page++;render();$('result').scrollIntoView({block:'center'})};render();
</script></body></html>
